name: Deploy to Itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Butler
        run: |
          # Use the updated itch.zone domain to prevent 404/download errors
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          # Check version to confirm installation succeeded
          ./butler -V
          
      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Use --verbose to force it to output specific authentication/path errors
          ./butler push . cannons024willrise/laserchess:html --verbose
