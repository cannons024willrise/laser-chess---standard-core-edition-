    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; max-width: 1100px; padding-bottom: 50px; }
        .history-line { white-space: pre-wrap; word-break: break-all; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .input-wrapper { display:flex; gap:8px; align-items:flex-start; width: 100%; }
        .prompt { white-space: pre; }
        .user-input-line { flex: 1; background: transparent; border: none; color: var(--bright); font: inherit; outline: none; resize: none; overflow: hidden; min-height: 1.2em; line-height: 1.2; padding: 0; margin: 0; white-space: pre-wrap; }
        .system-msg { color: var(--muted); }
        .success-msg { color: var(--bright); font-weight: 700; }
        .error-msg { color: var(--error); }
        .matrix-container { display: flex; flex-direction: column; margin: 6px 0 24px 0; font-family: 'Unifont', monospace; user-select: none; border-left: 2px solid var(--line); padding-left: 12px; }
        .matrix-row { display: flex; height: 36px; align-items: center; }
        .matrix-cell { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; font-weight: bold; touch-action: manipulation; }
        .matrix-cell.cursor { outline: 1px solid var(--bright); background: rgba(255,255,255,0.1); }
        .selected-piece { outline: 2px dashed #00ff00 !important; outline-offset: -2px; }
        .p-blue { color: var(--blue); }
        .p-red { color: var(--red); }
        .laser-path { color: var(--laser); }
        .reserved-blue { background-color: var(--blue-tint) !important; }
        .reserved-red { background-color: var(--red-tint) !important; }
    </style>
</head>

          if (p && INTERACTION_MAP[p.pieceType]?.[((Number(p.rotation)||0)%4+4)%4]?.[curr.dir]) {
              curr.dir = INTERACTION_MAP[p.pieceType][((Number(p.rotation)||0)%4+4)%4][curr.dir].next;
          } else if (p) { destroyed = p; break; }
          curr.x += DIRS[curr.dir].dx; curr.y += DIRS[curr.dir].dy;
      }
      return { path, destroyed };
  }
