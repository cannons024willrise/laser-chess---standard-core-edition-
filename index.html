<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - KHET 2.0 RULES EDITION</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; max-width: 1100px; padding-bottom: 50px; }
        .history-line { white-space: pre-wrap; word-break: break-all; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .input-wrapper { display:flex; gap:8px; align-items:flex-start; width: 100%; }
        .prompt { white-space: pre; }
        .user-input-line { flex: 1; background: transparent; border: none; color: var(--bright); font: inherit; outline: none; resize: none; overflow: hidden; min-height: 1.2em; line-height: 1.2; padding: 0; margin: 0; white-space: pre-wrap; }
        .system-msg { color: var(--muted); }
        .success-msg { color: var(--bright); font-weight: 700; }
        .error-msg { color: var(--error); }
        .highlight { color: var(--bright); font-weight: 700; }
        .wait-msg { color: var(--waiting); }
        
        .matrix-container { display: flex; flex-direction: column; margin: 6px 0 24px 0; font-family: 'Unifont', monospace; user-select: none; border-left: 2px solid var(--line); padding-left: 12px; }
        .matrix-row { display: flex; height: 36px; align-items: center; }
        .matrix-cell { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; font-weight: bold; touch-action: manipulation; }
        .matrix-lbl { color: var(--muted); font-weight: normal; }
        .p-blue { color: var(--blue); }
        .p-red { color: var(--red); }
        
        .laser-path { color: var(--laser) !important; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,0,0.5); }
        .laser-bounce { background-color: rgba(255, 255, 0, 0.2) !important; }
        
        .reserved-blue { background-color: var(--blue-tint) !important; }
        .reserved-red { background-color: var(--red-tint) !important; }
        
        .matrix-cell.cursor { background-color: rgba(255, 255, 255, 0.15); outline: 1px solid var(--bright); }
        .matrix-cell.selected { outline: 1px dashed var(--waiting) !important; background-color: rgba(0, 255, 0, 0.05); }
        .matrix-cell.target-preview { outline: 1px dashed var(--blue) !important; background-color: rgba(0, 212, 255, 0.1); }
    </style>
</head>
<body>
<div id="terminal-log"></div>

<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>

<script>
(() => {
  'use strict';

  const matchConfig = { apiKey: "AIzaSyBpOnnJInXkDPZ8hrKj-rpjw3qeTylxtw4", authDomain: "lasercheowefficiencymanager.firebaseapp.com", databaseURL: "https://lasercheowefficiencymanager-default-rtdb.firebaseio.com", projectId: "lasercheowefficiencymanager" };
  const gameConfig = { apiKey: "AIzaSyDv7keBI4B-TMp5hcVAYHeMfgWJdLHLJbE", authDomain: "laser-chess-low-efficiency.firebaseapp.com", databaseURL: "https://laser-chess-low-efficiency-default-rtdb.firebaseio.com", projectId: "laser-chess-low-efficiency" };
  const WORKER_URL = 'https://laserchessmatchmanager.later5143.workers.dev/';
  const GAME_ACTOR_URL = 'https://movecheckerlaserchesslowefficiencystandardversionthinkfun.later5143.workers.dev/';
  
  const matchApp = firebase.initializeApp(matchConfig, "matchApp");
  const gameApp = firebase.initializeApp(gameConfig, "gameApp");
  const dbMatch = firebase.database(matchApp);
  const dbGame = firebase.database(gameApp);

  const KEY_USER = 'ls_user', KEY_PASS = 'ls_pass', KEY_RID = 'ls_request_id';
  const logContainer = document.getElementById('terminal-log');
  const queue = [];
  let processing = false, currentPromptWrap = null, lockedMatchId = null;
  let rqPollInterval = null, waitAnimationInterval = null;
  let currentHead = null, modeShown = false, isPollingStarting = false, hostGamePollInterval = null; 
  let cursorX = 0, cursorY = 0, selectedPiece = null, latestState = null, activeMatrixContainer = null, hasMoved = false, hasRotated = false;
  let myColor = null, isHostRequestPending = false; // <--- New state flag

  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const BLUE_RESERVED = [{x: 9, y: 0}, {x: 9, y: 1}, {x: 9, y: 2}, {x: 9, y: 3}, {x: 9, y: 4}, {x: 9, y: 5}, {x: 9, y: 6}, {x: 9, y: 7}, {x: 1, y: 0}, {x: 1, y: 7}];
  const RED_RESERVED = [{x: 0, y: 0}, {x: 0, y: 1}, {x: 0, y: 2}, {x: 0, y: 3}, {x: 0, y: 4}, {x: 0, y: 5}, {x: 0, y: 6}, {x: 0, y: 7}, {x: 8, y: 0}, {x: 8, y: 7}];

  const ROTATION_TABLE = { 
    KING: { 0: '◈', 1: '◈', 2: '◈', 3: '◈' }, 
    LASER: { 0: '⫝', 1: '⟜', 2: 'Ͳ', 3: 'Ð' }, 
    SWITCH: { 0: '⟋', 1: '⟍', 2: '⟋', 3: '⟍' }, 
    DEFENDER: { 0: '⬓', 1: '◧', 2: '⬒', 3: '◨' }, 
    DEFLECTOR: { 0: '◤', 1: '◥', 2: '◢', 3: '◣' } 
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function createLine(cls='') { const d = document.createElement('div'); d.className = `history-line ${cls}`; if (currentPromptWrap) logContainer.insertBefore(d, currentPromptWrap); else logContainer.appendChild(d); return d; }
  function add(text, cls='', req=false, handler=null) { if (!req && processing) { type(text, cls, true); return; } queue.push({text,cls,req,handler}); if (!processing) run(); }
  async function run() { processing = true; while(queue.length) { const i = queue.shift(); if (i.req) await prompt(i.text, i.cls, i.handler || handleAuth); else await type(i.text, i.cls); } processing = false; }
  async function type(text, cls, immediate=false) { const l = createLine(cls); if (immediate) { l.textContent = text; return l; } for (const c of text) { l.textContent += c; await sleep(10); } return l; }
  
  async function prompt(text, cls, handler) {
    const wrap = document.createElement('div'); wrap.className = 'input-wrapper history-line';
    const p = document.createElement('span'); p.className = 'prompt'; wrap.appendChild(p);
    const input = document.createElement('textarea'); input.className = 'user-input-line'; input.rows = 1; input.spellcheck = false; input.autocapitalize = 'off'; input.autocomplete = 'off'; input.autocorrect = 'off'; wrap.appendChild(input);
    logContainer.appendChild(wrap); currentPromptWrap = wrap;
    for (const c of text) { p.textContent += c; await sleep(8); }
    const resize = () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; };
    input.addEventListener('input', resize); setTimeout(() => { input.focus(); resize(); }, 0);
    return new Promise(resolve => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = input.value.trim().toUpperCase(); input.disabled = true; const finalLine = createLine('highlight'); finalLine.textContent = p.textContent + v; wrap.remove(); currentPromptWrap = null; handler(v); resolve(); }
      });
    });
  }

  function getPieceChar(piece) { const type = String(piece.pieceType || '').toUpperCase(); const safeRot = ((Number(piece.rotation || 0) % 4) + 4) % 4; return ROTATION_TABLE[type] ? ROTATION_TABLE[type][safeRot] : '?'; }
  function isReservedSquare(x, y, color) { return color === 'BLUE' ? RED_RESERVED.some(s => s.x === x && s.y === y) : BLUE_RESERVED.some(s => s.x === x && s.y === y); }
  function getReservedSquareTint(x, y) { if (BLUE_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-blue'; if (RED_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-red'; return null; }
  const DIRS = [ { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 } ]; 
  function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
  
  function resolveMatchRecord(state) {
    if (!state || typeof state !== 'object') return { root: null, match: null, board: null };
    if (state.G && typeof state.G === 'object' && !Array.isArray(state.G)) {
      const matchId = lockedMatchId && state.G[lockedMatchId] ? lockedMatchId : Object.keys(state.G)[0];
      const match = matchId ? state.G[matchId] : null;
      return { root: state, match, board: match?.board || null };
    }
    return { root: state, match: state, board: state.board || state };
  }

  function getBoardRoot(state) { return resolveMatchRecord(state).board || {}; }
  function getStateTurn(state) { const { match, board } = resolveMatchRecord(state); return board?.turn ?? match?.turn ?? state?.turn ?? null; }
  function setStateTurn(state, nextTurn) { const { match, board } = resolveMatchRecord(state); if (!match) return; if (board) board.turn = nextTurn; match.turn = nextTurn; }
  function getBoardPieces(state) { const src = getBoardRoot(state); if (Array.isArray(src.pieces)) return src.pieces; if (src.pieces && typeof src.pieces === 'object') return Object.values(src.pieces); if (Array.isArray(src.board)) return src.board; if (typeof src.board === 'string') { try { return JSON.parse(src.board); } catch (e) { return []; } } return []; }
  function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
  function inBounds(x, y) { return x >= 0 && x <= 9 && y >= 0 && y <= 7; }

  function printTerminalMatrix(state, laserTrace = null) {
    latestState = state;
    const pieces = getBoardPieces(state);
    const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
    for (const piece of pieces) { if (!piece || !Number.isFinite(piece.x) || !Number.isFinite(piece.y)) continue; if (piece.x < 0 || piece.x > 9 || piece.y < 0 || piece.y > 7) continue; grid[piece.y][piece.x] = piece; }
    
    const container = document.createElement('div');
    container.className = 'matrix-container';

    let headerRow = document.createElement('div'); headerRow.className = 'matrix-row';
    let cornerCell = document.createElement('span'); cornerCell.className = 'matrix-cell matrix-lbl'; cornerCell.innerHTML = '&nbsp;'; headerRow.appendChild(cornerCell);
    for (let x = 0; x < 10; x++) { let lblCell = document.createElement('span'); lblCell.className = 'matrix-cell matrix-lbl'; lblCell.textContent = x; headerRow.appendChild(lblCell); }
    container.appendChild(headerRow);

    for (let y = 7; y >= 0; y--) {
      let rowEl = document.createElement('div'); rowEl.className = 'matrix-row';
      let yLbl = document.createElement('span'); yLbl.className = 'matrix-cell matrix-lbl'; yLbl.textContent = y; rowEl.appendChild(yLbl);
      for (let x = 0; x < 10; x++) {
        let cellEl = document.createElement('span'); cellEl.className = 'matrix-cell';
        const tint = getReservedSquareTint(x, y); if (tint) cellEl.classList.add(tint);
        cellEl.addEventListener('click', (e) => { if (isMobile) { e.preventDefault(); cursorX = x; cursorY = y; handleGridAction(); } });
        const p = grid[y][x];
        if (p) { cellEl.textContent = getPieceChar(p); cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); } else { cellEl.textContent = '·'; cellEl.style.color = 'var(--muted)'; }
        rowEl.appendChild(cellEl);
      }
      container.appendChild(rowEl);
    }
    if (activeMatrixContainer && activeMatrixContainer.parentNode) activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer); 
    else if (currentPromptWrap) logContainer.insertBefore(container, currentPromptWrap); else logContainer.appendChild(container); 
    activeMatrixContainer = container; 
    setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
  }

  function terminateMatch(msg) { add(msg, 'error-msg'); localStorage.removeItem(KEY_RID); lockedMatchId = null; activeMatrixContainer = null; modeShown = false; startPolling(); }

  function lockOntoMatch(id, entry) {
    lockedMatchId = id; localStorage.setItem(KEY_RID, id); stopPolling(); stopHostGamePolling(); toggleWaiting(false); modeShown = false;
    add(`LINK ESTABLISHED: ${id}`, 'success-msg'); 
    const gameRef = dbGame.ref(`G/${id}`);
    gameRef.on('value', snap => {
        const state = snap.val();
        if (state) { 
            latestState = state;
            const pieces = getBoardPieces(state);
            const myName = localStorage.getItem(KEY_USER);
            if (state.redPlayer === myName) myColor = 'RED'; else if (state.bluePlayer === myName) myColor = 'BLUE';
            if (!pieces.find(p => p.color === myColor && p.pieceType === 'KING')) { gameRef.off(); return terminateMatch("DEFEAT: Your Pharaoh has fallen."); }
            if (!pieces.find(p => p.color !== myColor && p.pieceType === 'KING')) { gameRef.off(); return terminateMatch("VICTORY: Enemy Pharaoh destroyed."); }
            printTerminalMatrix(state); 
        } else { terminateMatch('MATCH TERMINATED.'); gameRef.off(); }
    });
  }

  function toggleWaiting(active, contextMsg = "Awaiting Handshake") {
    if (active) {
      if (waitAnimationInterval) return; const l = createLine('wait-msg'); let dots = 0;
      waitAnimationInterval = setInterval(() => { dots = (dots + 1) % 4; l.textContent = contextMsg + ".".repeat(dots); }, 500);
    } else { if (waitAnimationInterval) { clearInterval(waitAnimationInterval); waitAnimationInterval = null; } }
  }

  async function handleAuth(v) {
    if (!localStorage.getItem(KEY_USER)) { if (!v) return add('User ID:', '', true, handleAuth); const candidate = v.trim().toUpperCase(); if (!candidate || await isUsernameOccupied(candidate)) { add(candidate ? 'USER ID ALREADY OCCUPIED.' : 'INVALID USER ID.', 'error-msg'); return add('User ID:', '', true, handleAuth); } localStorage.setItem(KEY_USER, candidate); return boot(); }
    if (!localStorage.getItem(KEY_PASS)) { if (!v) return add('Access Key:', '', true, handleAuth); localStorage.setItem(KEY_PASS, v); return boot(); }
  }

  async function boot() {
    const u = localStorage.getItem(KEY_USER), p = localStorage.getItem(KEY_PASS), rid = localStorage.getItem(KEY_RID);
    if (!u || !p) return add('TERMINAL LOCKED', 'system-msg'), add('User ID:', '', true, handleAuth);
    add('System Online.', 'success-msg');
    if (rid) { const snap = await dbGame.ref(`G/${rid}`).once('value'); if (snap.exists()) return lockOntoMatch(rid, snap.val()); else startHostGamePolling(); }
    if (!await searchForGameDBMatch()) await startPolling();
  }

  async function startPolling() {
    if (isPollingStarting) return; isPollingStarting = true;
    if (rqPollInterval) clearInterval(rqPollInterval); await pollFirstMatch({ silentEmpty: true }); modeShown = false; await showMode();
    if (!localStorage.getItem(KEY_RID) && !lockedMatchId) { rqPollInterval = setInterval(() => pollFirstMatch({ silentEmpty: false }), 6000); }
    isPollingStarting = false;
  }

  function stopPolling() { if (rqPollInterval) { clearInterval(rqPollInterval); rqPollInterval = null; } }
  function startHostGamePolling() { if (hostGamePollInterval) return; hostGamePollInterval = setInterval(async () => { if (await searchForGameDBMatch()) { isHostRequestPending = false; stopHostGamePolling(); } }, 3000); }
  function stopHostGamePolling() { if (hostGamePollInterval) { clearInterval(hostGamePollInterval); hostGamePollInterval = null; } toggleWaiting(false); }

  async function searchForGameDBMatch() {
    const myName = localStorage.getItem(KEY_USER); if (!myName) return false;
    try {
      const snap = await dbGame.ref('G').once('value'); const games = snap.val(); if (!games) return false;
      const matchID = Object.keys(games).find(key => String(key).toUpperCase().includes(myName.toUpperCase()));
      if (matchID) { add(`[AUTO-JOIN] Match detected: ${matchID}`, 'success-msg'); lockOntoMatch(matchID, games[matchID]); return true; }
    } catch (e) { console.error(e); } return false;
  }

  async function pollFirstMatch({ silentEmpty = false } = {}) {
    if (localStorage.getItem(KEY_RID) || lockedMatchId) return false;
    try {
      const snapshot = await dbMatch.ref('/RQ_Q').orderByKey().limitToFirst(1).once('value'); 
      const data = snapshot.val();
      if (!data) return false;
      const firstKey = Object.keys(data)[0]; 
      const matchData = data[firstKey];
      const myName = localStorage.getItem(KEY_USER) || '';
      if (matchData.username && matchData.username.toUpperCase() === myName.toUpperCase()) { return false; }
      currentHead = { id: firstKey, data: matchData };
      return true;
    } catch (e) { currentHead = null; return false; }
  }

  async function showMode() {
    if (localStorage.getItem(KEY_RID)) return; while (processing) await sleep(10); if (modeShown) return; modeShown = true;
    if (!currentHead) { add('Queue Empty. [R] Host Red | [B] Blue', 'system-msg'); } 
    else if (currentHead.data.color === 0) { add('RED at head. [A] Join as Blue | [R] Host Red', 'system-msg'); } 
    else { add('BLUE at head. [A] Join as Red | [B] Host Blue', 'system-msg'); }
    add('MODE:', '', true, handleMode);
  }

  async function handleMode(val) {
    if (val === 'A') { if (!currentHead) { add('JOIN FAILED.', 'error-msg'); modeShown = false; return showMode(); } registerHost(currentHead.data.color === 0 ? 1 : 0, true); }
    else if (val === 'R') registerHost(0, false); else if (val === 'B') registerHost(1, false);
    else { add('Unknown Command.', 'error-msg'); modeShown = false; showMode(); }
  }

  async function registerHost(color, isIntercept = false) {
    if (isHostRequestPending) { add("Request already in progress. Please wait...", "error-msg"); return; }
    isHostRequestPending = true;
    toggleWaiting(true, "Negotiating Match");
    try {
      const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), color, isIntercept }) }); const data = await res.json();
      if (data.ok) {
        const idToStore = data.matchName || data.requestId || data.timestamp; 
        if (idToStore) localStorage.setItem(KEY_RID, idToStore); 
        stopPolling(); 
        if (data.matchName) { isHostRequestPending = false; lockOntoMatch(data.matchName, { status: 'SYNCING' }); } 
        else { startHostGamePolling(); }
      } else { add(`Request rejected: ${data.error || 'Unknown'}`, 'error-msg'); isHostRequestPending = false; toggleWaiting(false); }
    } catch (e) { add(`Worker Error: ${e.message}`, 'error-msg'); isHostRequestPending = false; toggleWaiting(false); }
  }

  async function isUsernameOccupied(username) { if (!username) return true; try { const snap = await dbMatch.ref(`P/${username}`).once('value'); return snap.exists(); } catch (e) { return true; } }
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
