<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - KHET 2.0 RULES EDITION</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; }
        .history-line { white-space: pre-wrap; }
        .prompt { color: var(--bright); }
        .user-input-line { background: transparent; border: none; color: var(--bright); font-family: 'Unifont', monospace; font-size: 22px; width: 100%; outline: none; }
        .matrix-container { display: inline-block; padding: 20px; border: 1px solid var(--line); background: var(--bg1); margin-top: 10px; }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); cursor: pointer; }
        .reserved-blue { background: var(--blue-tint); }
        .reserved-red { background: var(--red-tint); }
        .p-red { color: var(--red); }
        .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); z-index: 1; }
        .selected-piece { background: var(--line); }
        .error-msg { color: var(--error); }
        .success-msg { color: var(--waiting); }
        .system-msg { color: var(--muted); }
        .highlight { color: var(--bright); }
    </style>
</head>
<body>
    <div id="terminal-log"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
    (() => {
      'use strict';

      const matchConfig = { apiKey: "AIzaSyBpOnnJInXkDPZ8hrKj-rpjw3qeTylxtw4", authDomain: "lasercheowefficiencymanager.firebaseapp.com", databaseURL: "https://lasercheowefficiencymanager-default-rtdb.firebaseio.com", projectId: "lasercheowefficiencymanager" };
      const gameConfig = { apiKey: "AIzaSyDv7keBI4B-TMp5hcVAYHeMfgWJdLHLJbE", authDomain: "laser-chess-low-efficiency.firebaseapp.com", databaseURL: "https://laser-chess-low-efficiency-default-rtdb.firebaseio.com", projectId: "laser-chess-low-efficiency" };
      const WORKER_URL = 'https://laserchessmatchmanager.later5143.workers.dev/';
      const MOVE_CHECKER_URL = 'https://movecheckerlaserchesslowefficiencystandardversionthinkfun.later5143.workers.dev/';
      
      const matchApp = firebase.initializeApp(matchConfig, "matchApp");
      const gameApp = firebase.initializeApp(gameConfig, "gameApp");
      const dbMatch = firebase.database(matchApp);
      const dbGame = firebase.database(gameApp);

      const KEY_USER = 'ls_user', KEY_PASS = 'ls_pass', KEY_RID = 'ls_request_id';
      const logContainer = document.getElementById('terminal-log');
      const queue = [];
      let processing = false, currentPromptWrap = null, lockedMatchId = null;
      let rqPollInterval = null, waitAnimationInterval = null, hostGamePollInterval = null;
      let currentHead = null, modeShown = false, isPollingStarting = false; 
      let cursorX = 0, cursorY = 0, latestState = null, activeMatrixContainer = null;
      let isHostRequestPending = false, requestStatus = "IDLE";
      let isAnimatingLocalTurn = false;
      let lastAnimatedTurn = null;
      let pendingStateUpdate = null;
      let activeGameRef = null;
      
      let selectedOrigin = null;

      const DIRS = [ { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 } ]; 
      const ROTATION_TABLE = { 
        KING: { 0: '◈', 1: '◈', 2: '◈', 3: '◈' }, 
        LASER: { 0: '⫝', 1: '⟜', 2: 'Ͳ', 3: 'Ð' }, 
        SWITCH: { 0: '⟋', 1: '⟍', 2: '⟋', 3: '⟍' }, 
        DEFENDER: { 0: '⬓', 1: '◧', 2: '⬒', 3: '◨' }, 
        DEFLECTOR: { 0: '◤', 1: '◥', 2: '◢', 3: '◣' } 
      };
      const BLUE_RESERVED = [{x: 9, y: 0}, {x: 9, y: 1}, {x: 9, y: 2}, {x: 9, y: 3}, {x: 9, y: 4}, {x: 9, y: 5}, {x: 9, y: 6}, {x: 9, y: 7}, {x: 1, y: 0}, {x: 1, y: 7}];
      const RED_RESERVED = [{x: 0, y: 0}, {x: 0, y: 1}, {x: 0, y: 2}, {x: 0, y: 3}, {x: 0, y: 4}, {x: 0, y: 5}, {x: 0, y: 6}, {x: 0, y: 7}, {x: 8, y: 0}, {x: 8, y: 7}];

      const INTERACTION_MAP = {
          DEFLECTOR: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 2 }, 1: { action: 'destroy' }, 2: { action: 'destroy' } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 2 }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 2: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 1: { action: 'destroy' } }
          },
          SWITCH: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } },
              2: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              3: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } }
          },
          DEFENDER: {
              0: { 0: { action: 'block' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 1: { action: 'block' }, 0: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 3: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' } }
          },
          KING: {
              0: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } }
          },
          LASER: {
              0: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              1: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              2: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              3: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } }
          }
      };

      function scrollToBottom() { window.scrollTo(0, document.body.scrollHeight); }
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      function setStatus(msg) { if (requestStatus === msg) return; requestStatus = msg; add(`[STATUS] ${msg}`, 'system-msg'); }
      function createLine(cls='') { const d = document.createElement('div'); d.className = `history-line ${cls}`; if (currentPromptWrap) logContainer.insertBefore(d, currentPromptWrap); else logContainer.appendChild(d); scrollToBottom(); return d; }
      function add(text, cls='', req=false, handler=null) { if (!req && processing) { type(text, cls, true); return; } queue.push({text,cls,req,handler}); if (!processing) run(); }
      async function run() { processing = true; while(queue.length) { const i = queue.shift(); if (i.req) await prompt(i.text, i.cls, i.handler || handleAuth); else await type(i.text, i.cls); } processing = false; }
      async function type(text, cls, immediate=false) { const l = createLine(cls); if (immediate) { l.textContent = text; return l; } for (const c of text) { l.textContent += c; await sleep(10); } return l; }
      
      async function prompt(text, cls, handler) {
        const wrap = document.createElement('div'); wrap.className = 'input-wrapper history-line';
        const p = document.createElement('span'); p.className = 'prompt'; wrap.appendChild(p);
        const input = document.createElement('textarea'); input.className = 'user-input-line'; input.rows = 1; input.spellcheck = false; wrap.appendChild(input);
        logContainer.appendChild(wrap); currentPromptWrap = wrap;
        for (const c of text) { p.textContent += c; await sleep(8); }
        input.focus();
        return new Promise(resolve => {
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = input.value.trim().toUpperCase(); input.disabled = true; const finalLine = createLine('highlight'); finalLine.textContent = p.textContent + v; wrap.remove(); currentPromptWrap = null; handler(v); resolve(); }
          });
        });
      }

      function getPieceChar(piece) { 
          const rot = piece.rotation || 0;
          return ROTATION_TABLE[piece.pieceType] ? ROTATION_TABLE[piece.pieceType][rot] : '?'; 
      }

      function getBoardPieces(state) { const src = state.board || state; return Array.isArray(src.pieces) ? src.pieces : (src.pieces ? Object.values(src.pieces) : []); }
      function getReservedClass(x, y) {
        if (BLUE_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-blue';
        if (RED_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-red';
        return null;
      }

      function inBounds(x, y) { return x >= 0 && x <= 9 && y >= 0 && y <= 7; }
      function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
      function isReservedSquare(x, y, color) { return color === 'BLUE' ? RED_RESERVED.some(s => s.x === x && s.y === y) : BLUE_RESERVED.some(s => s.x === x && s.y === y); }
      function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
      
      function interactWithLaser(piece, incomingDir) {
          const typeMap = INTERACTION_MAP[piece.pieceType];
          if (!typeMap) return { kind: 'stop', destroyed: false };
          const outcome = typeMap[normalizeRotation(piece.rotation)]?.[incomingDir];
          if (!outcome) return { kind: 'stop', destroyed: false };
          if (outcome.action === 'reflect') return { kind: 'reflect', destroyed: false, reflected: outcome.nextDir };
          if (outcome.action === 'block') return { kind: 'stop', blocked: true, destroyed: false };
          if (outcome.action === 'destroy') return { kind: 'stop', destroyed: true };
          return { kind: 'stop', destroyed: false };
      }

      function resolveLaserVector(x, y, dir, pieces, path = [], seen = new Set()) {
          if (!inBounds(x, y)) return { path, hit: null, looped: false };
          const stateKey = `${x},${y},${dir}`;
          if (seen.has(stateKey)) return { path, hit: null, looped: true };
          seen.add(stateKey);
          path.push({ x, y, dir });

          const piece = getPieceAt(pieces, x, y);
          if (!piece) return resolveLaserVector(x + DIRS[dir].dx, y + DIRS[dir].dy, dir, pieces, path, seen);

          const outcome = interactWithLaser(piece, dir);
          if (outcome.kind === 'reflect') {
              const nextDir = outcome.reflected;
              return resolveLaserVector(x + DIRS[nextDir].dx, y + DIRS[nextDir].dy, nextDir, pieces, path, seen);
          }
          return { path, hit: { piece, blocked: !!outcome.blocked, destroyed: !!outcome.destroyed }, looped: false };
      }

      async function playLaserAnimation(state, pieces, shooterColor, victimPiece = null) {
          isAnimatingLocalTurn = true;
          const animPieces = [...pieces];
          if (victimPiece && !animPieces.some(p => p.x === victimPiece.x && p.y === victimPiece.y)) {
              animPieces.push(victimPiece);
          }
          const animState = { ...state, board: { ...state.board, pieces: animPieces } };
          
          const shooter = animPieces.find(p => p && p.pieceType === 'LASER' && p.color === shooterColor);
          if (shooter) {
              const startDir = normalizeRotation(shooter.rotation);
              const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, animPieces);
              printTerminalMatrix(animState, [], false);
              await sleep(500);
              printTerminalMatrix(animState, trace.path, false);
              await sleep(1500);
          }
          isAnimatingLocalTurn = false;
      }

      function printTerminalMatrix(state, laserPath = [], replace = true) {
        latestState = state;
        const pieces = getBoardPieces(state);
        const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
        for (const piece of pieces) { if (piece && Number.isFinite(piece.x)) grid[piece.y][piece.x] = piece; }
        
        const container = document.createElement('div'); container.className = 'matrix-container';

        const myName = (localStorage.getItem(KEY_USER) || '').toUpperCase();
        let myColor = localStorage.getItem('ls_my_color');
        if (!myColor && state) {
          if (state.red && String(state.red).toUpperCase() === myName) myColor = 'RED';
          else if (state.blue && String(state.blue).toUpperCase() === myName) myColor = 'BLUE';
          else if (state.redPlayer && String(state.redPlayer).toUpperCase() === myName) myColor = 'RED';
          else if (state.bluePlayer && String(state.bluePlayer).toUpperCase() === myName) myColor = 'BLUE';
          else if (lockedMatchId && lockedMatchId.toUpperCase().startsWith(myName)) myColor = 'RED';
          else myColor = 'BLUE';
          localStorage.setItem('ls_my_color', myColor);
        }
        const currentTurn = state.board?.turn || state.turn || 'RED';
        const opponentColor = myColor === 'RED' ? 'BLUE' : 'RED';

        const statusBar = document.createElement('div');
        statusBar.className = 'history-line';
        statusBar.style.marginBottom = '12px';
        statusBar.style.fontSize = '20px';
        statusBar.style.borderBottom = '1px dashed var(--line)';
        statusBar.style.paddingBottom = '6px';
        statusBar.innerHTML = `[<span class="highlight">YOU</span>: <span class="p-${myColor?.toLowerCase()}">${myColor || 'UNKNOWN'}</span>] &nbsp;&nbsp; [<span class="highlight">OPPONENT</span>: <span class="p-${opponentColor.toLowerCase()}">${opponentColor}</span>] &nbsp;&nbsp; [<span class="highlight">CURRENT TURN</span>: <span class="p-${currentTurn.toLowerCase()}">${currentTurn}</span>]`;
        container.appendChild(statusBar);

        for (let y = 7; y >= 0; y--) {
          let rowEl = document.createElement('div'); rowEl.className = 'matrix-row';
          for (let x = 0; x < 10; x++) {
            let cellEl = document.createElement('span'); cellEl.className = 'matrix-cell';
            
            const resClass = getReservedClass(x, y);
            if (resClass) cellEl.classList.add(resClass);
            if (x === cursorX && y === cursorY) cellEl.classList.add('cursor');
            if (selectedOrigin && x === selectedOrigin.x && y === selectedOrigin.y) cellEl.classList.add('selected-piece');

            cellEl.addEventListener('click', (e) => { e.preventDefault(); if (isAnimatingLocalTurn) return; cursorX = x; cursorY = y; printTerminalMatrix(latestState); handleGridAction(); });
            const p = grid[y][x]; 
            if (p) { 
              cellEl.textContent = getPieceChar(p); 
              cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); 
            } else {
              const pathSegment = laserPath.find(seg => seg.x === x && seg.y === y);
              if (pathSegment) {
                const syms = ['^', '>', 'v', '<'];
                cellEl.textContent = syms[pathSegment.dir];
                cellEl.style.color = 'var(--laser)';
              } else {
                cellEl.textContent = '·'; 
              }
            }
            rowEl.appendChild(cellEl);
          }
          container.appendChild(rowEl);
        }
        
        if (replace && activeMatrixContainer && activeMatrixContainer.parentNode) activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer); 
        else if (currentPromptWrap) logContainer.insertBefore(container, currentPromptWrap); else logContainer.appendChild(container); 
        
        if (replace) activeMatrixContainer = container; 
        scrollToBottom();
      }

      window.addEventListener('keydown', (e) => {
        if (currentPromptWrap || isAnimatingLocalTurn) return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key) || 
            ['r', 'l', 'f'].includes(e.key.toLowerCase())) {
            e.preventDefault();
        } else {
            return;
        }
        if (e.key === 'ArrowUp' && cursorY < 7) cursorY++;
        else if (e.key === 'ArrowDown' && cursorY > 0) cursorY--;
        else if (e.key === 'ArrowLeft' && cursorX > 0) cursorX--;
        else if (e.key === 'ArrowRight' && cursorX < 9) cursorX++;
        else if (e.key === 'Enter') handleGridAction();
        else if (e.key.toLowerCase() === 'r') rotatePiece(1);
        else if (e.key.toLowerCase() === 'l') rotatePiece(-1);
        else if (e.key.toLowerCase() === 'f') skipTurnAndFire();
        
        if (latestState) printTerminalMatrix(latestState);
      });

      async function processGameAction(intent) {
        if (!latestState) return;
        const myName = localStorage.getItem(KEY_USER); const myPass = localStorage.getItem(KEY_PASS); const matchId = lockedMatchId || localStorage.getItem(KEY_RID);
        if (!matchId || !myName || !myPass) { add("Engine Rejection: Missing local session credentials.", "error-msg"); return; }
        const currentTurn = latestState.board?.turn || latestState.turn || 'RED';
        let myColor = localStorage.getItem('ls_my_color');
        if (!myColor) {
          if (latestState.red && String(latestState.red).toUpperCase() === myName.toUpperCase()) myColor = 'RED';
          else if (latestState.blue && String(latestState.blue).toUpperCase() === myName.toUpperCase()) myColor = 'BLUE';
          else if (latestState.redPlayer && String(latestState.redPlayer).toUpperCase() === myName.toUpperCase()) myColor = 'RED';
          else if (latestState.bluePlayer && String(latestState.bluePlayer).toUpperCase() === myName.toUpperCase()) myColor = 'BLUE';
          else if (lockedMatchId && lockedMatchId.toUpperCase().startsWith(myName.toUpperCase())) myColor = 'RED';
          else myColor = 'BLUE';
          localStorage.setItem('ls_my_color', myColor);
        }
        try {
            if (currentTurn !== myColor) throw new Error(`Turn violation: It is ${currentTurn}'s turn, but you are ${myColor}.`);
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const piecesDryRun = getBoardPieces(latestState);
                const dbPiece = getPieceAt(piecesDryRun, intent.piece.x, intent.piece.y);
                if (!dbPiece) throw new Error("Selection configuration anomaly: No piece occupies chosen origin.");
                if (dbPiece.color !== myColor) throw new Error(`Color ownership violation: Piece belongs to ${dbPiece.color}, but your assignment is ${myColor}.`);
                if (dbPiece.pieceType !== intent.piece.type) throw new Error("State discrepancy: Local component entity mismatch.");
                if (intent.action === 'Move') {
                    const nx = intent.changes.new.x; const ny = intent.changes.new.y; const dx = Math.abs(nx - dbPiece.x); const dy = Math.abs(ny - dbPiece.y);
                    if (dx > 1 || dy > 1 || (dx === 0 && dy === 0)) throw new Error("Invalid move: Relocation offset bounds exceeded.");
                    if (dbPiece.pieceType === 'LASER') throw new Error("Invalid move: Sphinx (LASER) structural column immobilized.");
                    if (isReservedSquare(nx, ny, dbPiece.color)) throw new Error("Invalid move: Restricted landing zone column conflict.");
                    const pieceAtTarget = getPieceAt(piecesDryRun, nx, ny);
                    if (pieceAtTarget) {
                        if (dbPiece.pieceType === 'SWITCH' && (pieceAtTarget.pieceType === 'DEFLECTOR' || pieceAtTarget.pieceType === 'DEFENDER')) {
                            if (isReservedSquare(dbPiece.x, dbPiece.y, pieceAtTarget.color)) throw new Error("Invalid move: Trapped swap rule violation on target zone.");
                        } else { throw new Error("Invalid move: Destructive spatial overlap. Target square occupied."); }
                    }
                } else if (intent.action === 'Rotate') {
                    const newRot = intent.changes.new.rotation;
                    if (dbPiece.pieceType === 'KING') throw new Error("Invalid rotate: Pharaoh (KING) directional system locked.");
                    if (dbPiece.pieceType === 'LASER') {
                        if (dbPiece.color === 'BLUE' && (newRot === 1 || newRot === 2)) throw new Error("Invalid rotate: Blue Sphinx sector limits restricted to 0 or 3.");
                        if (dbPiece.color === 'RED' && (newRot === 3 || newRot === 0)) throw new Error("Invalid rotate: Red Sphinx sector limits restricted to 1 or 2.");
                    }
                }
            }
        } catch (localErr) { add(`Local Validation Rejected: ${localErr.message}`, 'error-msg'); selectedOrigin = null; printTerminalMatrix(latestState); return; }
        const initialStateBackup = JSON.parse(JSON.stringify(latestState));
        isAnimatingLocalTurn = true; 
        try {
            const stateCopy = JSON.parse(JSON.stringify(latestState)); let pieces = getBoardPieces(stateCopy);
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
                if (intent.action === 'Move') {
                    const nx = intent.changes.new.x; const ny = intent.changes.new.y; const pieceAtTarget = getPieceAt(pieces, nx, ny);
                    if (pieceAtTarget && dbPiece.pieceType === 'SWITCH') { pieceAtTarget.x = dbPiece.x; pieceAtTarget.y = dbPiece.y; }
                    dbPiece.x = nx; dbPiece.y = ny; add(`MOVE METADATA: (${intent.piece.x},${intent.piece.y}) -> (${nx},${ny})`, 'success-msg');
                } else if (intent.action === 'Rotate') {
                    dbPiece.rotation = intent.changes.new.rotation; add(`ROTATION METADATA: ${dbPiece.pieceType} modified to position ${dbPiece.rotation}`, 'success-msg');
                }
                if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
            }
            const shooter = pieces.find(p => p && p.pieceType === 'LASER' && p.color === myColor);
            if (shooter) {
                const startDir = normalizeRotation(shooter.rotation);
                const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, pieces);
                const victim = (trace.hit && trace.hit.destroyed) ? trace.hit.piece : null;
                await playLaserAnimation(stateCopy, pieces, myColor, victim);
                if (victim) {
                    pieces = pieces.filter(p => !(p.x === victim.x && p.y === victim.y));
                    if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                    add(`Laser beam eliminated ${victim.color} ${victim.pieceType} at coordinate (${victim.x}, ${victim.y}).`, "error-msg");
                    if (victim.pieceType === 'KING') { 
                        const winnerColor = victim.color === 'RED' ? 'BLUE' : 'RED';
                        stateCopy.status = `${winnerColor}_WIN`; 
                        add(`CRITICAL ALERT: ${victim.color} KING DESTROYED. ${winnerColor} ACHIEVES VICTORY.`, "success-msg"); 
                    }
                    activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
                }
            }
            if (stateCopy.board) { stateCopy.board.turn = myColor === 'RED' ? 'BLUE' : 'RED'; stateCopy.board.moveNumber = (stateCopy.board.moveNumber || 0) + 1; }
            else { stateCopy.turn = myColor === 'RED' ? 'BLUE' : 'RED'; stateCopy.moveNumber = (stateCopy.moveNumber || 0) + 1; }
            latestState = stateCopy;
            add(`Transmitting intent: ${intent.action}...`, 'system-msg');
            const response = await fetch(MOVE_CHECKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ matchId: matchId, username: myName, password: myPass, intent: intent }) });
            const result = await response.json();
            if (!response.ok || !result.ok) throw new Error(result.error || "Unknown validation failure.");
        } catch (err) { add(`Engine Mutation Failure: ${err.message}`, 'error-msg'); latestState = initialStateBackup; } finally { 
            activeMatrixContainer = null; 
            isAnimatingLocalTurn = false; 
            printTerminalMatrix(latestState); 
            if (pendingStateUpdate) {
                const s = pendingStateUpdate;
                pendingStateUpdate = null;
                applyRemoteState(s);
            }
        }
        selectedOrigin = null;
      }

      async function skipTurnAndFire() { if (!latestState) return; add("Initiating direct fire / skipping move phase...", "system-msg"); await processGameAction({ action: 'Turn End' }); }
      function rotatePiece(dir) {
        if (!selectedOrigin || !latestState) return;
        const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
        if (p) { const nextRotation = ((p.rotation || 0) + dir + 4) % 4; processGameAction({ action: 'Rotate', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: p.pieceType }, changes: { new: { rotation: nextRotation } } }); }
      }

      async function handleGridAction() {
        if (!latestState || isAnimatingLocalTurn) return;
        if (!selectedOrigin) {
            const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === cursorX && p.y === cursorY);
            if (p) { selectedOrigin = { x: cursorX, y: cursorY }; add(`Selected: ${cursorX},${cursorY}`, 'system-msg'); } else { add(`No piece at ${cursorX},${cursorY}`, 'error-msg'); }
            printTerminalMatrix(latestState);
        } else {
            const pieces = getBoardPieces(latestState); const movingPiece = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
            if (selectedOrigin.x === cursorX && selectedOrigin.y === cursorY) { selectedOrigin = null; add(`Deselected`, 'system-msg'); printTerminalMatrix(latestState); }
            else { await processGameAction({ action: 'Move', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: movingPiece ? movingPiece.pieceType : null }, changes: { new: { x: cursorX, y: cursorY } } }); }
        }
      }

      function terminateMatch(msg) { 
        add(msg, 'error-msg'); 
        localStorage.removeItem(KEY_RID); 
        localStorage.removeItem('ls_my_color'); 
        lockedMatchId = null; 
        activeMatrixContainer = null; 
        modeShown = false; 
        if (activeGameRef) { activeGameRef.off(); activeGameRef = null; }
        setStatus("IDLE"); 
        startPolling(); 
      }

      async function applyRemoteState(state) {
        const status = state.status || '';
        const ld = state.metadata?.lastdestroyed;
        const currentMoveNum = state.board?.moveNumber || state.moveNumber || 0;
        
        let gameOverDetected = false;
        let victoryMsg = "";

        if (status.endsWith('_WIN')) {
            gameOverDetected = true;
            const winnerColor = status.split('_')[0];
            const loserColor = winnerColor === 'RED' ? 'BLUE' : 'RED';
            victoryMsg = `CRITICAL ALERT: ${loserColor} KING ELIMINATED. ${winnerColor} ACHIEVES VICTORY!`;
        } else if (status === 'DRAW_REPETITION') {
            gameOverDetected = true;
            victoryMsg = `GAME DRAWN: Three-fold repetition detected.`;
        }

        isAnimatingLocalTurn = true;
        try {
          if (ld && ld.turn === currentMoveNum - 1 && lastAnimatedTurn !== ld.turn) {
              lastAnimatedTurn = ld.turn;
              await playLaserAnimation(state, getBoardPieces(state), ld.shooterColor, ld.piece);
              add(`Visual Summary: Laser blast vaporized ${ld.piece.color} ${ld.piece.pieceType} at (${ld.piece.x}, ${ld.piece.y}).`, "error-msg");
              
              if (ld.piece.pieceType === 'KING') {
                  gameOverDetected = true;
                  const winnerColor = ld.piece.color === 'RED' ? 'BLUE' : 'RED';
                  victoryMsg = `CRITICAL ALERT: ${ld.piece.color} KING DESTROYED. ${winnerColor} ACHIEVES VICTORY!`;
              }
          }

          printTerminalMatrix(state); 

          if (gameOverDetected) {
              add(victoryMsg, "success-msg");
              add("Game Over. Disconnecting terminal and rolling back to lobby setup in 5 seconds...", "system-msg");
              pendingStateUpdate = null;
              if (activeGameRef) { activeGameRef.off(); activeGameRef = null; }
              await sleep(5000);
              terminateMatch('Handshake reset complete.');
          }
        } finally {
          isAnimatingLocalTurn = false;
          if (pendingStateUpdate && !gameOverDetected) {
              const s = pendingStateUpdate;
              pendingStateUpdate = null;
              applyRemoteState(s);
          }
        }
      }

      function lockOntoMatch(id, entry) {
        lockedMatchId = id; localStorage.setItem(KEY_RID, id); stopPolling(); stopHostGamePolling(); toggleWaiting(false); modeShown = false;
        setStatus("LOCKED");
        isAnimatingLocalTurn = false;
        pendingStateUpdate = null;
        add(`LINK ESTABLISHED: ${id}`, 'success-msg'); 
        activeGameRef = dbGame.ref(`G/${id}`);
        
        activeGameRef.on('value', async snap => { 
          const state = snap.val(); 
          if (!state) { terminateMatch('MATCH TERMINATED.'); return; } 

          if (isAnimatingLocalTurn && latestState) {
              pendingStateUpdate = state;
              return;
          }
          await applyRemoteState(state);
        });
      }

      function toggleWaiting(active, contextMsg = "Awaiting Handshake") {
        if (active) { if (waitAnimationInterval) return; const l = createLine('wait-msg'); let dots = 0; waitAnimationInterval = setInterval(() => { dots = (dots + 1) % 4; l.textContent = contextMsg + ".".repeat(dots); }, 500); } 
        else { if (waitAnimationInterval) { clearInterval(waitAnimationInterval); waitAnimationInterval = null; } }
      }

      async function handleAuth(v) {
        if (!localStorage.getItem(KEY_USER)) { if (!v) return add('User ID:', '', true, handleAuth); localStorage.setItem(KEY_USER, v.trim().toUpperCase()); return boot(); }
        if (!localStorage.getItem(KEY_PASS)) { if (!v) return add('Access Key:', '', true, handleAuth); localStorage.setItem(KEY_PASS, v); return boot(); }
      }

      async function boot() {
        const u = localStorage.getItem(KEY_USER), p = localStorage.getItem(KEY_PASS), rid = localStorage.getItem(KEY_RID);
        if (!u || !p) return add('USERNAME CAPTURED FOR 24H SUCCESSFULLY', 'system-msg'), add('Session Password:', '', true, handleAuth);
        add('Ready to play!', 'success-msg');
        
        if (rid) { 
            const snapGame = await dbGame.ref(`G/${rid}`).once('value'); 
            if (snapGame.exists()) return lockOntoMatch(rid, snapGame.val()); 
            else { 
                localStorage.removeItem(KEY_RID); localStorage.removeItem('ls_my_color'); add("Stale match data cleared.", "system-msg"); 
            }
        }
        if (!lockedMatchId) await startPolling();
      }

      async function startPolling() {
        if (isPollingStarting) return; isPollingStarting = true;
        if (rqPollInterval) clearInterval(rqPollInterval); await pollFirstMatch({ silentEmpty: true }); modeShown = false; await showMode();
        if (!localStorage.getItem(KEY_RID) && !lockedMatchId) { rqPollInterval = setInterval(() => pollFirstMatch({ silentEmpty: false }), 6000); }
        isPollingStarting = false;
      }

      function stopPolling() { if (rqPollInterval) { clearInterval(rqPollInterval); rqPollInterval = null; } }
      function startHostGamePolling() { if (hostGamePollInterval) return; setStatus("SCANNING_DB"); hostGamePollInterval = setInterval(async () => { if (await searchForGameDBMatch()) { isHostRequestPending = false; stopHostGamePolling(); } }, 3000); }
      function stopHostGamePolling() { if (hostGamePollInterval) { clearInterval(hostGamePollInterval); hostGamePollInterval = null; } toggleWaiting(false); }

      async function searchForGameDBMatch() {
        const myName = localStorage.getItem(KEY_USER); if (!myName) return false;
        try {
          const snap = await dbGame.ref('G').once('value'); const games = snap.val(); if (!games) return false;
          const matchID = Object.keys(games).find(key => String(key).toUpperCase().includes(myName.toUpperCase()));
          if (matchID) { add(`[AUTO-JOIN] Match detected: ${matchID}`, 'success-msg'); lockOntoMatch(matchID, games[matchID]); return true; }
        } catch (e) { console.error(e); } return false;
      }

      async function pollFirstMatch({ silentEmpty = false } = {}) {
        if (localStorage.getItem(KEY_RID) || lockedMatchId) return false;
        try {
          const snapshot = await dbMatch.ref('/RQ_Q').orderByKey().limitToFirst(1).once('value'); 
          const data = snapshot.val();
          if (!data) return false;
          const firstKey = Object.keys(data)[0]; 
          const matchData = data[firstKey];
          const myName = localStorage.getItem(KEY_USER) || '';
          if (matchData.username && matchData.username.toUpperCase() === myName.toUpperCase()) return false;
          currentHead = { id: firstKey, data: matchData }; return true;
        } catch (e) { currentHead = null; return false; }
      }

      async function showMode() {
        if (lockedMatchId) return; 
        while (processing) await sleep(10); 
        if (modeShown) return; 
        modeShown = true;
        
        let menu = "--- MENU ---\n";
        if (isHostRequestPending) {
            menu += "[X] Cancel Pending Request";
        } else {
            if (!currentHead) menu += "Queue Empty.\n";
            else if (currentHead.data.color === 0) menu += "RED at head. [A] Join as Blue\n"; 
            else menu += "BLUE at head. [A] Join as Red\n";
            menu += "[R] Host Red | [B] Host Blue | [P] Host Private | [J] Join Private";
        }
        add(menu, 'system-msg');
        add('MODE:', '', true, handleMode);
      }

      async function handleMode(val) {
        if (isHostRequestPending && val === 'X') {
            localStorage.removeItem(KEY_RID);
            window.location.reload();
            return;
        }
        if (val === 'A') { 
            if (!currentHead) { add('JOIN FAILED.', 'error-msg'); modeShown = false; return showMode(); } 
            registerHost(currentHead.data.color === 0 ? 1 : 0, true); 
        } else if (val === 'R') { registerHost(0, false); } 
        else if (val === 'B') { registerHost(1, false); }
        else if (val === 'P') {
            add('Target Username ([ENTER] for open):', '', true, async (target) => {
                add('Choose Color:\n[R] Red | [B] Blue', '', true, async (colorKey) => {
                    const color = (colorKey === 'R') ? 0 : 1;
                    requestPrivateMatch(color, target || null);
                });
            });
        }
        else if (val === 'J') {
            add('Enter Invite Code:', '', true, async (code) => {
                joinPrivateMatch(code);
            });
        }
        else { add('Unknown Command.', 'error-msg'); modeShown = false; showMode(); }
      }

      async function requestPrivateMatch(color, target) {
          setStatus("NEGOTIATING_PRIVATE");
          toggleWaiting(true, "Creating Private Lobby");
          try {
              const res = await fetch(WORKER_URL, { 
                  method: 'POST', 
                  headers: { 'Content-Type': 'application/json' }, 
                  body: JSON.stringify({ 
                      mode: "PRIVATE_MATCH_REQUEST", 
                      body: { 
                          requester: localStorage.getItem(KEY_USER), 
                          secret: localStorage.getItem(KEY_PASS), 
                          color, 
                          target 
                      } 
                  }) 
              });
              const data = await res.json();
              if (data.ok) {
                  add(`Lobby Created!\nInvite Code: ${data.inviteCode}`, 'success-msg');
                  localStorage.setItem(KEY_RID, data.requestId);
                  setStatus("WAITING_FOR_GUEST");
                  startHostGamePolling();
              } else {
                  add(`Private Request Rejected: ${data.error}`, 'error-msg');
                  toggleWaiting(false);
              }
          } catch (e) {
              add(`Connection Error: ${e.message}`, 'error-msg');
              toggleWaiting(false);
          }
      }

      async function joinPrivateMatch(inviteCode) {
          setStatus("JOINING_PRIVATE");
          toggleWaiting(true, "Joining Lobby");
          try {
              const res = await fetch(WORKER_URL, { 
                  method: 'POST', 
                  headers: { 'Content-Type': 'application/json' }, 
                  body: JSON.stringify({ 
                      username: localStorage.getItem(KEY_USER),
                      password: localStorage.getItem(KEY_PASS),
                      isPrivate: true,
                      privateMode: "JOIN",
                      inviteCode
                  }) 
              });
              const data = await res.json();
              if (data.ok) {
                  add(`Successfully joined ${data.matchName}`, 'success-msg');
                  lockOntoMatch(data.matchName, { status: 'SYNCING' });
              } else {
                  add(`Join Failed: ${data.error}`, 'error-msg');
                  toggleWaiting(false);
              }
          } catch (e) {
              add(`Connection Error: ${e.message}`, 'error-msg');
              toggleWaiting(false);
          }
      }

      async function registerHost(color, isIntercept = false) {
        if (isHostRequestPending) { add("Request already in progress.", "error-msg"); return; }
        isHostRequestPending = true;
        setStatus("NEGOTIATING");
        toggleWaiting(true, "Negotiating Match");
        localStorage.setItem('ls_my_color', color === 0 ? 'RED' : 'BLUE');
        try {
          const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), color, isIntercept }) }); const data = await res.json();
          if (data.ok) {
            const idToStore = data.matchName || data.requestId || data.timestamp; 
            if (idToStore) localStorage.setItem(KEY_RID, idToStore); 
            stopPolling(); 
            if (data.matchName) { isHostRequestPending = false; setStatus("LOCKED"); lockOntoMatch(data.matchName, { status: 'SYNCING' }); } 
            else { setStatus("WAITING_FOR_DB"); startHostGamePolling(); }
          } else { add(`Request rejected: ${data.error || 'Unknown'}`, 'error-msg'); isHostRequestPending = false; setStatus("IDLE"); toggleWaiting(false); localStorage.removeItem('ls_my_color'); }
        } catch (e) { add(`Worker Error: ${e.message}`, 'error-msg'); isHostRequestPending = false; setStatus("IDLE"); toggleWaiting(false); localStorage.removeItem('ls_my_color'); }
      }

      window.addEventListener('DOMContentLoaded', boot);
    })();
    </script>
