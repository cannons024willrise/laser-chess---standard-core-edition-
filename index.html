<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - INTEGRATED CORE</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { --bg0: #0a0a0a; --bg1: #1a1a1a; --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; --muted: #999999; --waiting: #00ff00; }
        body { margin: 0; padding: 20px; color: var(--text); font-family: 'Unifont', monospace; background: var(--bg0); display: flex; gap: 20px; height: 100vh; overflow: hidden; }

        /* Board Styling */
        #board-container { flex: 0 0 auto; display: grid; grid-template-columns: repeat(10, 40px); grid-template-rows: repeat(8, 40px); gap: 2px; border: 1px solid #333; }
        .cell { width: 40px; height: 40px; background: var(--bg1); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
        .cell.selected { background: #333; outline: 1px solid var(--waiting); }

        /* Terminal Styling */
        #terminal { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        #terminal-log { flex: 1; }
        .input-wrapper { display: flex; gap: 8px; align-items: flex-start; }
        .user-input-line { background: transparent; border: none; color: var(--bright); font: inherit; outline: none; flex: 1; }
    </style>
</head>
<body>

<div id="board-container" tabindex="0"></div>
<div id="terminal">
    <div id="terminal-log"></div>
</div>

<script>
    // --- 1. BOARD ENGINE ---
    const BoardEngine = (() => {
        const board = document.getElementById('board-container');
        let state = Array(8).fill(null).map(() => Array(10).fill(null)); // 8x10
        let selected = { x: 0, y: 0 };

        function render() {
            board.innerHTML = '';
            for (let y = 7; y >= 0; y--) {
                for (let x = 0; x < 10; x++) {
                    const el = document.createElement('div');
                    el.className = `cell ${selected.x === x && selected.y === y ? 'selected' : ''}`;
                    el.textContent = state[y][x] || '.';
                    board.appendChild(el);
                }
            }
        }

        // Logic for movement/selection
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === document.querySelector('.user-input-line')) return;
            
            if (e.key === 'w') selected.y = Math.min(7, selected.y + 1);
            if (e.key === 's') selected.y = Math.max(0, selected.y - 1);
            if (e.key === 'a') selected.x = Math.max(0, selected.x - 1);
            if (e.key === 'd') selected.x = Math.min(9, selected.x + 1);
            render();
        });

        return { render };
    })();

    // --- 2. TERMINAL ENGINE ---
    const TerminalEngine = (() => {
        const logContainer = document.getElementById('terminal-log');
        let currentPromptWrap = null;

        function createLine(cls) {
            const d = document.createElement('div');
            d.className = `history-line ${cls}`;
            logContainer.appendChild(d);
            return d;
        }

        function prompt(text, handler) {
            const wrap = document.createElement('div');
            wrap.className = 'input-wrapper';
            wrap.innerHTML = `<span class="prompt">${text}</span><textarea class="user-input-line" rows="1"></textarea>`;
            logContainer.appendChild(wrap);
            const input = wrap.querySelector('textarea');
            input.focus();
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const v = input.value.trim().toUpperCase();
                    wrap.remove();
                    handler(v);
                }
            });
        }

        return {
            add: (text, cls = '') => { createLine(cls).textContent = text; },
            prompt
        };
    })();

    // --- 3. INIT ---
    window.addEventListener('DOMContentLoaded', () => {
        BoardEngine.render();
        TerminalEngine.add('CORE INITIALIZED', 'success-msg');
        TerminalEngine.prompt('COMMAND >', (cmd) => {
            TerminalEngine.add(`EXECUTING: ${cmd}`, 'system-msg');
        });
    });
</script>
</body>
</html>
