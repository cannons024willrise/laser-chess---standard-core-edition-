<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - STANDARD VARIANT- CORE EDITION (BETA η-)</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; 
            --bg1: #1a1a1a; 
            --line: #2a2a2a;
            --text: #b0b0b0; 
            --bright: #ffffff; 
            --error: #ff5555; 
            --muted: #999999; 
            --waiting: #00ff00; 
            --blue: #00d4ff;
            --red: #ff3333;
        }
        body { margin: 0; padding: 30px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; max-width: 1100px; }
        .history-line { white-space: pre-wrap; word-break: break-all; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .input-wrapper { display:flex; gap:8px; align-items:flex-start; width: 100%; }
        .prompt { white-space: pre; }
        .user-input-line {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--bright);
            font: inherit;
            outline: none;
            resize: none;
            overflow: hidden;
            min-height: 1.2em;
            line-height: 1.2;
            padding: 0;
            margin: 0;
            white-space: pre-wrap;
        }
        .system-msg { color: var(--muted); }
        .success-msg { color: var(--bright); font-weight: 700; }
        .error-msg { color: var(--error); }
        .highlight { color: var(--bright); font-weight: 700; }
        .wait-msg { color: var(--waiting); }
        
        .copy-btn {
            background: #2a2a2a;
            color: var(--waiting);
            border: 1px solid var(--waiting);
            font-family: 'Unifont', monospace;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            user-select: none;
            display: inline-block;
        }
        .copy-btn:hover {
            background: var(--waiting);
            color: var(--bg0);
        }
        .copy-btn:active {
            transform: scale(0.95);
        }

        /* MATRIX TERMINAL RENDERER STYLES */
        .matrix-container {
            display: flex;
            flex-direction: column;
            margin: 6px 0 16px 0;
            font-family: 'Unifont', monospace;
            user-select: none;
        }
        .matrix-row {
            display: flex;
            height: 24px;
            align-items: center;
        }
        .matrix-cell {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            font-weight: bold;
            transition: background-color 0.1s ease;
        }
        .matrix-lbl {
            color: var(--muted);
            font-weight: normal;
        }
        .p-blue { color: var(--blue); }
        .p-red { color: var(--red); }

        /* INTERACTIVE INPUT STYLES */
        .matrix-cell.cursor {
            background-color: rgba(255, 255, 255, 0.15);
            outline: 1px solid var(--bright);
        }
        .matrix-cell.selected {
            outline: 1px dashed var(--waiting) !important;
            background-color: rgba(0, 255, 0, 0.05);
        }
        .matrix-cell.target-preview {
            outline: 1px dashed var(--blue) !important;
            background-color: rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body>
<div id="terminal-log"></div>

<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>

<script>
(() => {
  'use strict';

  const matchConfig = {
    apiKey: "AIzaSyBpOnnJInXkDPZ8hrKj-rpjw3qeTylxtw4",
    authDomain: "lasercheowefficiencymanager.firebaseapp.com",
    databaseURL: "https://lasercheowefficiencymanager-default-rtdb.firebaseio.com",
    projectId: "lasercheowefficiencymanager"
  };

  const gameConfig = {
    apiKey: "AIzaSyDv7keBI4B-TMp5hcVAYHeMfgWJdLHLJbE",
    authDomain: "laser-chess-low-efficiency.firebaseapp.com",
    databaseURL: "https://laser-chess-low-efficiency-default-rtdb.firebaseio.com",
    projectId: "laser-chess-low-efficiency"
  };

  const WORKER_URL = 'https://laserchessmatchmanager.later5143.workers.dev/';
  
  const matchApp = firebase.initializeApp(matchConfig, "matchApp");
  const gameApp = firebase.initializeApp(gameConfig, "gameApp");
  const dbMatch = firebase.database(matchApp);
  const dbGame = firebase.database(gameApp);

  const KEY_USER = 'ls_user', KEY_PASS = 'ls_pass', KEY_RID = 'ls_request_id';
  const logContainer = document.getElementById('terminal-log');
  const queue = [];
  let processing = false, currentPromptWrap = null, lockedMatchId = null;
  let rqPollInterval = null, recoveryPollInterval = null, waitAnimationInterval = null, lastQueueState = 'INIT';
  let currentHead = null;
  let initialQueueScanDone = false;
  let modeShown = false;
  let privateState = null;
  
  let isPollingStarting = false;
  let hostGamePollInterval = null; 

  // Interactive UI State Properties
  let cursorX = 0;
  let cursorY = 0;
  let selectedPiece = null;
  let latestState = null;
  let activeMatrixContainer = null;

  // Renderer asset definitions
  const symbols = {
    KING: '◈',
    LASER: ['⫝', '⟜', 'Ͳ', 'Ð'],
    SWITCH: ['⟋', '⟍'],
    DEFENDER: ['⬒', '◨', '⬓', '◧'],
    DEFLECTOR: ['◤', '◥', '◢', '◣']
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function createLine(cls='') {
    const d = document.createElement('div');
    d.className = `history-line ${cls}`;
    if (currentPromptWrap) logContainer.insertBefore(d, currentPromptWrap);
    else logContainer.appendChild(d);
    return d;
  }

  function createLineWithCopy(text, codeToCopy, cls='') {
    const container = createLine(cls);
    
    const textSpan = document.createElement('span');
    textSpan.textContent = text;
    container.appendChild(textSpan);
    
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '[COPY CODE]';
    btn.onclick = async () => {
        try {
            await navigator.clipboard.writeText(codeToCopy);
            btn.textContent = '[COPIED!]';
        } catch (err) {
            const dummy = document.createElement('textarea');
            dummy.value = codeToCopy;
            document.body.appendChild(dummy);
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            btn.textContent = '[COPIED!]';
        }
        setTimeout(() => { btn.textContent = '[COPY CODE]'; }, 2000);
    };
    
    container.appendChild(btn);
    return container;
  }

  function add(text, cls='', req=false, handler=null) {
    if (!req && processing) { type(text, cls, true); return; }
    queue.push({text,cls,req,handler});
    if (!processing) run();
  }

  async function run() {
    processing = true;
    while(queue.length) {
      const i = queue.shift();
      if (i.req) await prompt(i.text, i.cls, i.handler || handleAuth);
      else await type(i.text, i.cls);
    }
    processing = false;
  }

  async function type(text, cls, immediate=false) {
    const l = createLine(cls);
    if (immediate) { l.textContent = text; return l; }
    for (const c of text) { l.textContent += c; await sleep(10); }
    return l;
  }

  async function prompt(text, cls, handler) {
    const wrap = document.createElement('div');
    wrap.className = 'input-wrapper history-line';

    const p = document.createElement('span');
    p.className = 'prompt';
    wrap.appendChild(p);

    const input = document.createElement('textarea');
    input.className = 'user-input-line';
    input.rows = 1;
    input.spellcheck = false;
    input.autocapitalize = 'off';
    input.autocomplete = 'off';
    input.autocorrect = 'off';
    wrap.appendChild(input);

    logContainer.appendChild(wrap);
    currentPromptWrap = wrap;

    for (const c of text) { p.textContent += c; await sleep(8); }

    const resize = () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    };

    const handleInput = () => { resize(); };

    setTimeout(() => {
      input.focus();
      resize();
    }, 0);

    input.addEventListener('input', handleInput);

    return new Promise(resolve => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const v = input.value.trim().toUpperCase();
          input.disabled = true;
          const finalLine = createLine('highlight');
          finalLine.textContent = p.textContent + v;
          wrap.remove();
          currentPromptWrap = null;
          handler(v);
          resolve();
        }
      });
    });
  }

  function getPieceChar(piece) {
    const type = String(piece.pieceType || '').toUpperCase();
    const rot = Number(piece.rotation !== undefined ? piece.rotation : 0) % 4;
    
    if (type === 'KING') return symbols.KING;
    if (type === 'LASER') return symbols.LASER[rot];
    if (type === 'SWITCH') return (rot === 1 || rot === 3) ? symbols.SWITCH[0] : symbols.SWITCH[1];
    if (type === 'DEFENDER') return symbols.DEFENDER[rot];
    if (type === 'DEFLECTOR') return symbols.DEFLECTOR[rot];
    return '?';
  }

  function printTerminalMatrix(state) {
    latestState = state;
    let pieces = [];
    
    const src = state.board && typeof state.board === 'object' && !Array.isArray(state.board)
        ? state.board
        : state;

    if (Array.isArray(src.pieces)) {
        pieces = src.pieces;
    } else if (src.pieces && typeof src.pieces === 'object') {
        pieces = Object.values(src.pieces);
    } else if (Array.isArray(src.board)) {
        pieces = src.board;
    } else if (typeof src.board === 'string') {
        try { pieces = JSON.parse(src.board); } catch(e){}
    }

    const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
    for (const piece of pieces) {
      if (!piece || !Number.isFinite(piece.x) || !Number.isFinite(piece.y)) continue;
      if (piece.x < 0 || piece.x > 9 || piece.y < 0 || piece.y > 7) continue;
      grid[piece.y][piece.x] = piece;
    }

    const container = document.createElement('div');
    container.className = 'matrix-container';

    // Top X Index Label Line
    let headerRow = document.createElement('div');
    headerRow.className = 'matrix-row';
    let cornerCell = document.createElement('span');
    cornerCell.className = 'matrix-cell matrix-lbl';
    cornerCell.innerHTML = '&nbsp;';
    headerRow.appendChild(cornerCell);
    for (let x = 0; x < 10; x++) {
      let lblCell = document.createElement('span');
      lblCell.className = 'matrix-cell matrix-lbl';
      lblCell.textContent = x;
      headerRow.appendChild(lblCell);
    }
    container.appendChild(headerRow);

    // Grid row assembly (inverted Y axis projection)
    for (let y = 7; y >= 0; y--) {
      let rowEl = document.createElement('div');
      rowEl.className = 'matrix-row';
      
      let yLbl = document.createElement('span');
      yLbl.className = 'matrix-cell matrix-lbl';
      yLbl.textContent = y;
      rowEl.appendChild(yLbl);

      for (let x = 0; x < 10; x++) {
        let cellEl = document.createElement('span');
        cellEl.className = 'matrix-cell';
        
        // Active Navigation Cursor Highlights
        if (x === cursorX && y === cursorY) {
          cellEl.classList.add('cursor');
        }
        
        // Target Location Dashed Movement Preview Updates
        if (selectedPiece && selectedPiece.x === x && selectedPiece.y === y) {
          cellEl.classList.add('selected');
        } else if (selectedPiece && x === cursorX && y === cursorY) {
          cellEl.classList.add('target-preview');
        }

        const p = grid[y][x];
        if (p) {
          cellEl.textContent = getPieceChar(p);
          cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue');
        } else {
          cellEl.textContent = '·';
          cellEl.style.color = 'var(--bright)';
        }
        rowEl.appendChild(cellEl);
      }
      container.appendChild(rowEl);
    }

    // Single-matrix layout updates to prevent log spamming during real-time movement updates
    if (activeMatrixContainer && activeMatrixContainer.parentNode) {
      activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer);
    } else {
      if (currentPromptWrap) logContainer.insertBefore(container, currentPromptWrap);
      else logContainer.appendChild(container);
    }
    activeMatrixContainer = container;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function updateMatrixView() {
    if (latestState) {
      printTerminalMatrix(latestState);
    }
  }

  // Hardware Actions Strategy Handlers
  function handleGridAction() {
    if (!latestState) return;

    const src = latestState.board && typeof latestState.board === 'object' && !Array.isArray(latestState.board) ? latestState.board : latestState;
    let pieces = [];
    
    if (Array.isArray(src.pieces)) pieces = src.pieces;
    else if (src.pieces && typeof src.pieces === 'object') pieces = Object.values(src.pieces);

    let pieceAtCursor = pieces.find(p => p && p.x === cursorX && p.y === cursorY);

    if (selectedPiece) {
      if (selectedPiece.x === cursorX && selectedPiece.y === cursorY) {
        selectedPiece = null;
        add("Selection dropped.", "system-msg");
      } else {
        let targetPiece = pieces.find(p => p && p.x === selectedPiece.x && p.y === selectedPiece.y);
        if (targetPiece) {
          const oldX = targetPiece.x;
          const oldY = targetPiece.y;
          targetPiece.x = cursorX;
          targetPiece.y = cursorY;
          
          if (src.turn !== undefined) {
            src.turn = src.turn === 'RED' ? 'BLUE' : 'RED';
          }
          
          dbGame.ref(`G/${lockedMatchId}`).set(latestState);
          add(`Piece relocated: (${oldX}, ${oldY}) -> (${cursorX}, ${cursorY})`, "success-msg");
        }
        selectedPiece = null;
      }
    } else {
      if (pieceAtCursor) {
        selectedPiece = { x: cursorX, y: cursorY };
        add(`Target selected at (${cursorX}, ${cursorY})`, "success-msg");
      } else {
        add(`Invalid action: No grid piece detected at (${cursorX}, ${cursorY})`, "error-msg");
      }
    }
    updateMatrixView();
  }

  function handleRotation(dir) {
    if (!latestState || !selectedPiece) {
      add("Action dropped: Select a piece before initiating rotation transformations.", "error-msg");
      return;
    }

    const src = latestState.board && typeof latestState.board === 'object' && !Array.isArray(latestState.board) ? latestState.board : latestState;
    let pieces = [];
    
    if (Array.isArray(src.pieces)) pieces = src.pieces;
    else if (src.pieces && typeof src.pieces === 'object') pieces = Object.values(src.pieces);

    let targetPiece = pieces.find(p => p && p.x === selectedPiece.x && p.y === selectedPiece.y);
    if (targetPiece) {
      let currentRot = Number(targetPiece.rotation !== undefined ? targetPiece.rotation : 0);
      targetPiece.rotation = dir === 'R' ? (currentRot + 1) % 4 : (currentRot + 3) % 4;
      
      if (src.turn !== undefined) {
        src.turn = src.turn === 'RED' ? 'BLUE' : 'RED';
      }

      dbGame.ref(`G/${lockedMatchId}`).set(latestState);
      add(`Rotation applied at (${selectedPiece.x}, ${selectedPiece.y}) -> ${dir === 'R' ? 'CW' : 'CCW'}`, "success-msg");
    }
    updateMatrixView();
  }

  async function pollFirstMatch({ silentEmpty = false } = {}) {
    if (localStorage.getItem(KEY_RID) || lockedMatchId) return false;

    try {
      const snapshot = await dbMatch.ref('/RQ_Q').orderByKey().limitToFirst(1).once('value');
      const data = snapshot.val();

      if (!data) {
        currentHead = null;
        if (!silentEmpty && initialQueueScanDone && lastQueueState !== 'EMPTY') {
          add('RQ_Q: Empty (Idle)', 'system-msg');
          lastQueueState = 'EMPTY';
        }
        return false;
      }

      initialQueueScanDone = true;
      const firstKey = Object.keys(data)[0];
      currentHead = { id: firstKey, data: data[firstKey] };

      if (lastQueueState !== firstKey) {
        add(`[AUTO-SCAN] Head detected: ${data[firstKey].username} (${data[firstKey].color === 0 ? 'RED' : 'BLUE'})`, 'success-msg');
        lastQueueState = firstKey;
      }

      return true;
    } catch (e) {
      currentHead = null;
      return false;
    }
  }

  async function showMode() {
    if (localStorage.getItem(KEY_RID)) return;

    while (processing) {
      await sleep(10);
    }

    if (modeShown) return;
    modeShown = true;

    const privateSuffix = ' | [P] Private Host | [J] Private Join';

    if (!currentHead) {
      add('Queue Empty. [R] Host Red | [B] Host Blue' + privateSuffix, 'system-msg');
    } else if (currentHead.data.color === 0) {
      add('RED at head. [A] Join as Blue | [R] Host Red' + privateSuffix, 'system-msg');
    } else {
      add('BLUE at head. [A] Join as Red | [B] Host Blue' + privateSuffix, 'system-msg');
    }
    add('MODE:', '', true, handleMode);
  }

  async function startPolling() {
    if (isPollingStarting) return;
    isPollingStarting = true;

    if (rqPollInterval) clearInterval(rqPollInterval);

    await pollFirstMatch({ silentEmpty: true });

    modeShown = false;
    await showMode();

    if (!localStorage.getItem(KEY_RID) && !lockedMatchId) {
      rqPollInterval = setInterval(() => pollFirstMatch({ silentEmpty: false }), 6000);
    }
    isPollingStarting = false;
  }

  function stopPolling() { 
    if (rqPollInterval) { clearInterval(rqPollInterval); rqPollInterval = null; } 
    lastQueueState = 'STOPPED';
  }

  async function searchForGameDBMatch() {
    const myName = localStorage.getItem(KEY_USER);
    if (!myName) return false;

    try {
      const snap = await dbGame.ref('G').once('value');
      const games = snap.val();
      if (!games) return false;

      const upperName = myName.toUpperCase();

      const matchID = Object.keys(games).find(key =>
        String(key).toUpperCase().includes(upperName)
      );

      if (matchID) {
        add(`[AUTO-JOIN] Match detected in /G: ${matchID}`, 'success-msg');
        lockOntoMatch(matchID, games[matchID]);
        return true;
      }
    } catch (e) {
      console.error(e);
    }

    return false;
  }

  function startHostMatchWorkerPolling(requestId, contextMsg = "Awaiting Handshake") {
    stopHostGamePolling();

    const passiveGamePoll = async () => {
      if (lockedMatchId) return;
      const found = await searchForGameDBMatch();
      if (found) {
        stopHostGamePolling();
        toggleWaiting(false);
      }
    };

    passiveGamePoll();
    stopHostGamePolling();
    toggleWaiting(true, contextMsg);

    hostGamePollInterval = setInterval(async () => {
      if (lockedMatchId || localStorage.getItem(KEY_RID) !== requestId.toString()) {
        stopHostGamePolling();
        toggleWaiting(false);
        return;
      }

      try {
        const snap = await dbMatch.ref(`RQ_D/${requestId}`).once('value');
        const data = snap.val();

        if (data && data.matchName) {
          stopHostGamePolling();
          toggleWaiting(false);
          lockOntoMatch(data.matchName, { status: 'SYNCING' });
        } else if (!data) {
          stopHostGamePolling();
          toggleWaiting(false);
          
          const foundMatchInG = await searchForGameDBMatch();
          if (!foundMatchInG) {
            add('Match request expired or consumed.', 'error-msg');
            localStorage.removeItem(KEY_RID);
            modeShown = false;
            await startPolling();
          }
        }
      } catch (e) {
        console.error("RTDB match status polling error:", e);
      }
    }, 3000);
  }

  function stopHostGamePolling() {
    if (hostGamePollInterval) {
      clearInterval(hostGamePollInterval);
      hostGamePollInterval = null;
    }
  }

  async function verifyRequestIdByRQD(requestId) {
    if (!requestId) return false;
    try {
      const snap = await dbMatch.ref(`RQ_D/${requestId}`).once('value');
      return snap.exists() ? snap.val() : false;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function isUsernameOccupied(username) {
    if (!username) return true;
    try {
      const snap = await dbMatch.ref(`P/${username}`).once('value');
      return snap.exists();
    } catch (e) {
      console.error(e);
      return true;
    }
  }

  async function verifyRecoveryPath(requestId) {
    if (!requestId) return { state: 'missing', data: null };

    const qd = await verifyRequestIdByRQD(requestId);
    if (qd) {
      if (qd.matchName) return { state: 'matched', data: qd };
      return { state: 'waiting', data: qd };
    }

    return { state: 'missing', data: null };
  }

  function stopRecoveryPolling() {
    if (recoveryPollInterval) {
      clearInterval(recoveryPollInterval);
      recoveryPollInterval = null;
    }
  }

  function startRecoveryPolling(requestId) {
    stopRecoveryPolling();
    toggleWaiting(true, "Recovering Uplink Signal");

    let attempts = 0;
    const maxAttempts = 18;

    const tick = async () => {
      if (lockedMatchId || localStorage.getItem(KEY_RID) !== requestId) {
        stopRecoveryPolling();
        toggleWaiting(false);
        return;
      }

      const recovered = await verifyRecoveryPath(requestId);

      if (recovered.state === 'matched') {
        stopRecoveryPolling();
        toggleWaiting(false);
        add('Recovering uplink...', 'system-msg');
        lockOntoMatch(recovered.data.matchName, recovered.data);
        return;
      }

      if (recovered.state === 'waiting') {
        stopRecoveryPolling();
        toggleWaiting(false);
        add('Recovering uplink...', 'system-msg');
        if (recovered.data.isPrivate && recovered.data.inviteCode) {
          startHostMatchWorkerPolling(requestId, `Awaiting Private Join [CODE: ${recovered.data.inviteCode}]`);
        } else {
          startHostMatchWorkerPolling(requestId, "Awaiting Public Match Intercept");
        }
        return;
      }

      attempts += 1;
      if (attempts === 1) add('Recovering uplink...', 'system-msg');

      if (attempts >= maxAttempts) {
        stopRecoveryPolling();
        toggleWaiting(false);
        stopHostGamePolling();

        const foundMatchInG = await searchForGameDBMatch();
        if (!foundMatchInG) {
          localStorage.removeItem(KEY_RID);
          modeShown = false;
          await startPolling();
        }
      }
    };

    tick();
    recoveryPollInterval = setInterval(tick, 4000);
  }

  async function handleMode(val) {
    if (privateState) {
      return handlePrivateFlow(val);
    }

    if (val === 'A') {
      if (!currentHead) { add('JOIN FAILED: No active signals.', 'error-msg'); modeShown = false; return showMode(); }
      toggleWaiting(true, `Intercepting ${currentHead.id}`);
      return registerHost(currentHead.data.color === 0 ? 1 : 0, true); 
    }
    if (val === 'R') return registerHost(0, false); 
    if (val === 'B') return registerHost(1, false);

    if (val === 'P') {
      privateState = { step: 'TARGET', target: null };
      return add('TARGET USER (OPTIONAL - ENTER TO SKIP):', '', true, handlePrivateFlow);
    }

    if (val === 'J') {
      privateState = { step: 'CODE' };
      return add('INVITE CODE:', '', true, handlePrivateFlow);
    }

    add('Unknown Command.', 'error-msg');
    modeShown = false;
    return showMode();
  }

  async function handlePrivateFlow(v) {
    if (!privateState) {
      modeShown = false;
      return showMode();
    }

    if (privateState.step === 'TARGET') {
      const raw = (v || '').trim();

      if (!raw) {
        privateState.target = null;
        privateState.step = 'COLOR';
        return add('HOST COLOR : [R] RED | [B] BLUE', '', true, handlePrivateFlow);
      }

      const target = raw.toUpperCase();

      if (target === localStorage.getItem(KEY_USER)) {
        add('CANNOT TARGET SELF.', 'error-msg');
        privateState = null;
        modeShown = false;
        return showMode();
      }

      const exists = await isUsernameOccupied(target);
      if (!exists) {
        add('TARGET USER NOT FOUND.', 'error-msg');
        privateState = null;
        modeShown = false;
        return showMode();
      }

      privateState.target = target;
      privateState.step = 'COLOR';
      return add('HOST COLOR : [R] RED | [B] BLUE', '', true, handlePrivateFlow);
    }

    if (privateState.step === 'COLOR') {
      const input = (v || '').trim().toUpperCase();

      const colorChar = input.includes('R') ? 'R' : input.includes('B') ? 'B' : null;
      const color = colorChar === 'R' ? 0 : colorChar === 'B' ? 1 : null;

      if (color === null) {
        add('Unknown Command.', 'error-msg');
        privateState = null;
        modeShown = false;
        return showMode();
      }

      const target = privateState.target;
      privateState = null;

      return createPrivateRequest(color, target);
    }

    if (privateState.step === 'CODE') {
      const code = (v || '').trim().toUpperCase();
      if (!code) {
        add('INVALID CODE.', 'error-msg');
        privateState = null;
        modeShown = false;
        return showMode();
      }

      privateState = null;
      return joinPrivate(code);
    }

    privateState = null;
    modeShown = false;
    return showMode();
  }

  async function joinPrivate(inviteCode) {
    const username = localStorage.getItem(KEY_USER);
    const password = localStorage.getItem(KEY_PASS);

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username,
          password,
          isPrivate: true,
          privateMode: 'JOIN',
          inviteCode
        })
      });

      const data = await res.json();
      if (data.ok) {
        const idToStore = data.matchName || data.matchId || data.requestId || data.timestamp;
        if (idToStore) localStorage.setItem(KEY_RID, idToStore);
        stopPolling();
        add('Private Link Success!', 'success-msg');

        if (data.matchName) {
          lockOntoMatch(data.matchName, { status: 'SYNCING' });
        } else if (data.requestId) {
          startHostMatchWorkerPolling(data.requestId, "Awaiting Private Handshake");
        }
        return;
      }

      add(`Private Join Denied: ${data.error}`, 'error-msg');
      modeShown = false;
      return showMode();
    } catch (e) {
      add(`Worker Error: ${e.message}`, 'error-msg');
      modeShown = false;
      return showMode();
    }
  }

  async function createPrivateRequest(color, privateTarget = null) {
    const username = localStorage.getItem(KEY_USER);
    const password = localStorage.getItem(KEY_PASS);

    const privateRequestPayload = {
      mode: 'PRIVATE_MATCH_REQUEST',
      body: {
        requester: username,
        secret: password,
        color,
        target: privateTarget
      }
    };

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(privateRequestPayload)
      });

      const data = await res.json();
      if (data.ok) {
        const privateRequestId = data.requestId;
        if (privateRequestId) localStorage.setItem(KEY_RID, privateRequestId);
        
        stopPolling();
        
        if (data.inviteCode) {
          try { await navigator.clipboard.writeText(data.inviteCode); } catch(cErr){}
          createLineWithCopy(`Private Request Generated! CODE: ${data.inviteCode} `, data.inviteCode, 'success-msg');
        } else {
          add('Private Request Generated!', 'success-msg');
        }
        
        startHostMatchWorkerPolling(privateRequestId, `Awaiting Private Join [CODE: ${data.inviteCode}]`);
        return;
      }

      add(`Private Request Denied: ${data.error}`, 'error-msg');
      modeShown = false;
      return showMode();
    } catch (e) {
      add(`Worker Error: ${e.message}`, 'error-msg');
      modeShown = false;
      return showMode();
    }
  }

  async function registerHost(color, isIntercept = false, extra = {}) {
    const username = localStorage.getItem(KEY_USER);
    const password = localStorage.getItem(KEY_PASS);
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, color, isIntercept, ...extra })
      });
      const data = await res.json();
      if (data.ok) {
        const idToStore = data.matchName || data.requestId || data.timestamp;
        if (idToStore) localStorage.setItem(KEY_RID, idToStore);
        stopPolling();
        add(`${extra.isPrivate ? 'Private' : (isIntercept ? 'Intercept' : 'Uplink')} Success!`, 'success-msg');

        if (data.matchName) {
          lockOntoMatch(data.matchName, { status: 'SYNCING' });
        } else {
          const requestIdToPoll = data.requestId || data.timestamp;
          if (requestIdToPoll) {
            startHostMatchWorkerPolling(requestIdToPoll, isIntercept ? "Awaiting Intercept Handshake" : "Awaiting Public Match Intercept");
          }
        }

        return;
      } else {
        add(`Uplink Denied: ${data.error}`, 'error-msg');
        modeShown = false;
        return showMode();
      }
    } catch (e) {
      add(`Worker Error: ${e.message}`, 'error-msg');
      modeShown = false;
      return showMode();
    }
  }

  function lockOntoMatch(id, entry) {
    lockedMatchId = id;
    localStorage.setItem(KEY_RID, id); 
    stopPolling(); 
    toggleWaiting(false);
    stopHostGamePolling();

    modeShown = false;
    add(`LINK ESTABLISHED: ${id}`, 'success-msg');
    
    const gameRef = dbGame.ref(`G/${id}`);
    gameRef.on('value', snap => {
        const state = snap.val();
        if (state) {
            const turnDisplay = state.board?.turn ?? state.turn ?? 'N/A';
            add(`[SYNC] Turn: ${turnDisplay}`, 'system-msg');
            printTerminalMatrix(state);
        } else {
            add('MATCH TERMINATED.', 'error-msg');
            localStorage.removeItem(KEY_RID);
            lockedMatchId = null;
            activeMatrixContainer = null;
            gameRef.off();
            modeShown = false;
            startPolling();
        }
    });
  }

  function toggleWaiting(active, contextMsg = "Awaiting Handshake") {
    if (active) {
      if (waitAnimationInterval) return;
      const l = createLine('wait-msg');
      let dots = 0;
      waitAnimationInterval = setInterval(() => { 
        dots = (dots + 1) % 4; 
        l.textContent = contextMsg + ".".repeat(dots); 
      }, 500);
    } else { 
      if (waitAnimationInterval) { 
        clearInterval(waitAnimationInterval); 
        waitAnimationInterval = null; 
      } 
    }
  }

  async function handleAuth(v) {
    if (!localStorage.getItem(KEY_USER)) {
      if (!v) return add('User ID:', '', true, handleAuth);

      const candidate = v.trim().toUpperCase();
      if (!candidate) {
        add('INVALID USER ID.', 'error-msg');
        return add('User ID:', '', true, handleAuth);
      }

      const occupied = await isUsernameOccupied(candidate);
      if (occupied) {
        add('USER ID ALREADY OCCUPIED.', 'error-msg');
        return add('User ID:', '', true, handleAuth);
      }

      localStorage.setItem(KEY_USER, candidate);
      return boot();
    }
    if (!localStorage.getItem(KEY_PASS)) {
      if (!v) return add('Access Key:', '', true, handleAuth);
      localStorage.setItem(KEY_PASS, v);
      return boot();
    }
  }

  async function boot() {
    const u = localStorage.getItem(KEY_USER), p = localStorage.getItem(KEY_PASS), rid = localStorage.getItem(KEY_RID);
    if (!u || !p) return add('TERMINAL LOCKED', 'system-msg'), add('User ID:', '', true, handleAuth);
    
    add('System Online.', 'success-msg');
    
    if (rid && rid.toString().includes('_')) {
        const snap = await dbGame.ref(`G/${rid}`).once('value');
        if (snap.exists()) return lockOntoMatch(rid, snap.val());

        localStorage.removeItem(KEY_RID);
    }

    if (rid && !rid.toString().includes('_')) {
        const rqdEntry = await verifyRequestIdByRQD(rid);
        if (rqdEntry) {
            add('Recovering uplink...', 'system-msg');
            
            if (rqdEntry.isPrivate && rqdEntry.inviteCode) {
                createLineWithCopy(`Re-asserted Private Code: ${rqdEntry.inviteCode} `, rqdEntry.inviteCode, 'success-msg');
                startHostMatchWorkerPolling(rid, `Awaiting Private Join [CODE: ${rqdEntry.inviteCode}]`);
            } else {
                startHostMatchWorkerPolling(rid, "Awaiting Public Match Intercept");
            }
            return;
        }
        localStorage.removeItem(KEY_RID);
    }

    const foundInGameDB = await searchForGameDBMatch();
    if (!foundInGameDB) {
      await startPolling();
    }
  }

  // Intercept Global Keyboard Stream for Active Matrix Controls
  window.addEventListener('keydown', e => {
    if (!lockedMatchId || !latestState) return;

    // Relinquish event stream control safely if the user is typing message strings into input prompts
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
      if (document.activeElement.value.trim().length > 0) {
        return;
      }
    }

    switch (e.key) {
      case 'ArrowUp':
        if (cursorY < 7) cursorY++;
        updateMatrixView();
        e.preventDefault();
        break;
      case 'ArrowDown':
        if (cursorY > 0) cursorY--;
        updateMatrixView();
        e.preventDefault();
        break;
      case 'ArrowLeft':
        if (cursorX > 0) cursorX--;
        updateMatrixView();
        e.preventDefault();
        break;
      case 'ArrowRight':
        if (cursorX < 9) cursorX++;
        updateMatrixView();
        e.preventDefault();
        break;
      case ' ':
      case 'Enter':
        handleGridAction();
        e.preventDefault();
        break;
      case 'l':
      case 'L':
        handleRotation('L');
        e.preventDefault();
        break;
      case 'r':
      case 'R':
        handleRotation('R');
        e.preventDefault();
        break;
    }
  });

  window.addEventListener('DOMContentLoaded', async () => {
    await boot();
  });
})();
</script>
