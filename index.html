<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khet Terminal</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #terminal {
            width: 100%;
            max-width: 900px;
            background-color: #000000;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            padding: 20px;
            box-sizing: border-box;
            min-height: 500px;
            overflow-y: auto;
        }
        .system-msg {
            color: #00ffff;
            margin-bottom: 15px;
            border-bottom: 1px dashed #00ffff;
            padding-bottom: 5px;
        }
        .error-msg {
            color: #ff3333;
        }
        .success-msg {
            color: #33ff33;
        }
        .menu-option {
            margin: 5px 0;
            cursor: pointer;
        }
        .menu-option:hover {
            background-color: #112211;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            max-width: 600px;
            margin: 20px auto;
            border: 2px solid #00ff66;
            padding: 5px;
            background-color: #111;
        }
        .cell {
            aspect-ratio: 1;
            border: 1px solid #224422;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
            background-color: #050505;
        }
        .cursor {
            outline: 2px solid #ffffff;
            background-color: #223322;
            box-shadow: inset 0 0 10px #00ff66;
        }
        .selected-piece {
            background-color: #442222;
            color: #ff5555;
        }
        .laser-path {
            background-color: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 8px #ff0000;
        }
        .thematic-font {
            font-family: 'Courier New', Courier, monospace;
        }
        .basic-font {
            font-family: Arial, sans-serif;
        }
        a {
            color: #ffff00;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="system-msg" class="system-msg">Initializing core sub-routines...</div>
        <div id="output"></div>
    </div>

    <script>
        // Storage Keys
        const KEY_USER = 'khet_user';
        const KEY_PASS = 'khet_pass';
        const KEY_FONT = 'khet_font';
        const KEY_LOCAL_STATE = 'khet_local_state';
        const KEY_RID = 'khet_room_id';

        // State Machine
        let currentState = 'BOOT'; 
        let selectedMode = '';
        let selectedColor = '';
        let cursorX = 0;
        let cursorY = 0;
        let selectedPiece = null;

        // Dummy Matrix Configuration for Khet Grid (8 rows, 10 columns)
        let matrix = Array(8).fill(null).map(() => Array(10).fill('.'));

        function addHTML(html, targetId = 'output') {
            const el = document.getElementById(targetId);
            if (targetId === 'system-msg') {
                el.innerHTML = html;
            } else {
                el.innerHTML += `<div>${html}</div>`;
            }
            // Fallback general scrolling for output accumulation
            const term = document.getElementById('terminal');
            term.scrollTop = term.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        // Smart UI Navigation Scroll Hook
        function scrollToTerminal() {
            const terminalElement = document.getElementById('terminal');
            if (terminalElement) {
                terminalElement.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }
        }

        // Boot system check
        function boot() {
            currentState = 'BOOT';
            clearOutput();
            addHTML('Tutorial: <a href="https://www.youtube.com/watch?v=R9V43nU-9_Q" target="_blank">Watch Khet Tutorial</a>', 'system-msg');
            
            if (!localStorage.getItem(KEY_USER) || !localStorage.getItem(KEY_PASS)) {
                handleAuth();
                return;
            }

            if (!localStorage.getItem(KEY_FONT)) {
                handleFontChoice();
                return;
            }

            // Apply loaded font preference
            const savedFont = localStorage.getItem(KEY_FONT);
            document.body.className = savedFont === 'Thematic' ? 'thematic-font' : 'basic-font';

            // Check Reconnection
            if (localStorage.getItem(KEY_LOCAL_STATE) || localStorage.getItem(KEY_RID)) {
                addHTML('Active session detected. Reconnecting...');
                setTimeout(() => {
                    initializeGame();
                }, 1000);
                return;
            }

            showMode();
        }

        function handleAuth() {
            currentState = 'AUTH_REQUIRED';
            addHTML('Authentication Required.');
            addHTML('Press [A] to generate temporary credentials and proceed.');
        }

        function handleFontChoice() {
            currentState = 'FONT_SELECTION';
            addHTML('Select Interface Typographic Schema:');
            addHTML('[T] Thematic (Monospace System)');
            addHTML('[B] Basic (Standard Sans)');
        }

        function showMode() {
            currentState = 'MENU';
            clearOutput();
            addHTML('--- MAIN MENU MODE SELECTION ---');
            addHTML('<div class="menu-option">[C] Classic Local Match</div>');
            addHTML('<div class="menu-option">[L] Local AI Simulation</div>');
            addHTML('<div class="menu-option">[P] Public PvP Network Match</div>');
            addHTML('<div class="menu-option">[J] Join Private Custom Room</div>');
            addHTML('Select operational paradigm to initialize setup.');
            // NOTICE: No structural window/element scrolling occurs here to maintain viewport layout
        }

        function triggerColorSelectionFlow(mode) {
            selectedMode = mode;
            currentState = 'SELECT_COLOR';
            clearOutput();
            addHTML(`Mode [${mode}] allocated successfully.`);
            addHTML('Select Tactical Alignment: (W)hite [First Move Advantage] or (B)lack [Counter Stratagem]');
            
            // SMART SCROLL TRIGGER: Viewport repositions exactly prior to user interaction setup
            scrollToTerminal();
        }

        function initializeGame() {
            currentState = 'PLAYING';
            clearOutput();
            addHTML(`Match initialized. Mode: ${selectedMode} | Grid Matrix active. Use Arrows to guide cursor, [Enter] to select.`);
            printTerminalMatrix();
        }

        function printTerminalMatrix() {
            let gridHTML = '<div class="grid-container">';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 10; c++) {
                    let classes = 'cell';
                    if (r === cursorY && c === cursorX) classes += ' cursor';
                    if (selectedPiece && selectedPiece.x === c && selectedPiece.y === r) classes += ' selected-piece';
                    
                    gridHTML += `<div class="${classes}">${matrix[r][c]}</div>`;
                }
            }
            gridHTML += '</div>';
            gridHTML += '<div>[F] Fire Laser | [L] Rotate Left | [R] Rotate Right | [Q] Abort Action</div>';
            
            // Overwrite dynamic elements cleanly
            const currentGrid = document.getElementById('game-grid');
            if (currentGrid) currentGrid.remove();
            
            const wrapper = document.createElement('div');
            wrapper.id = 'game-grid';
            wrapper.innerHTML = gridHTML;
            document.getElementById('output').appendChild(wrapper);
        }

        function processGameAction(action) {
            addHTML(`Action logged: ${action}`, 'system-msg');
            printTerminalMatrix();
        }

        // Keydown Event Central Hub Router
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();

            if (currentState === 'AUTH_REQUIRED' && key === 'A') {
                localStorage.setItem(KEY_USER, 'User_' + Math.floor(Math.random() * 1000));
                localStorage.setItem(KEY_PASS, 'Token_' + Math.random().toString(36).substring(7));
                boot();
                return;
            }

            if (currentState === 'FONT_SELECTION') {
                if (key === 'T') {
                    localStorage.setItem(KEY_FONT, 'Thematic');
                    boot();
                } else if (key === 'B') {
                    localStorage.setItem(KEY_FONT, 'Basic');
                    boot();
                }
                return;
            }

            if (currentState === 'MENU') {
                if (key === 'C' || key === 'L') {
                    triggerColorSelectionFlow(key);
                } else if (key === 'P' || key === 'J') {
                    addHTML('Network features restricted. Please select Local configurations [C / L].', 'system-msg');
                }
                return;
            }

            if (currentState === 'SELECT_COLOR') {
                if (key === 'W' || key === 'B') {
                    selectedColor = key;
                    localStorage.setItem(KEY_LOCAL_STATE, JSON.stringify({ mode: selectedMode, color: selectedColor }));
                    initializeGame();
                }
                return;
            }

            if (currentState === 'PLAYING') {
                switch(e.key) {
                    case 'ArrowUp': if (cursorY > 0) cursorY--; break;
                    case 'ArrowDown': if (cursorY < 7) cursorY++; break;
                    case 'ArrowLeft': if (cursorX > 0) cursorX--; break;
                    case 'ArrowRight': if (cursorX < 9) cursorX++; break;
                    case 'Enter':
                        if (selectedPiece) {
                            selectedPiece = null; 
                            processGameAction('Move Piece executed');
                        } else {
                            selectedPiece = { x: cursorX, y: cursorY };
                        }
                        break;
                    case 'l':
case 'L': 
                        processGameAction('Rotate Anti-Clockwise'); 
                        break;
                    case 'r':
case 'R': 
                        processGameAction('Rotate Clockwise'); 
                        break;
                    case 'f':
case 'F': 
                        processGameAction('Laser Matrix Discharged'); 
                        break;
                    case 'q':
case 'Q':
                        localStorage.removeItem(KEY_LOCAL_STATE);
                        localStorage.removeItem(KEY_RID);
                        addHTML('Termination signal received. Reverting terminal operational metrics...', 'system-msg');
                        setTimeout(() => { boot(); }, 1500);
                        break;
                }
                printTerminalMatrix();
            }
        });

        // Fire initialization sequence on document read status
        window.onload = boot;
    </script>
</body>
</html>
