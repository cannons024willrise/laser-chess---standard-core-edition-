    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        body.basic-font, body.basic-font .user-input-line { font-family: 'Courier New', monospace; }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; }
        .history-line { white-space: pre-wrap; }
        .prompt { color: var(--bright); }
        .user-input-line { background: transparent; border: none; color: var(--bright); font-family: 'Unifont', monospace; font-size: 22px; width: 100%; outline: none; }
        .matrix-container { display: inline-block; padding: 20px; border: 1px solid var(--line); background: var(--bg1); margin-top: 10px; }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); cursor: pointer; }
        .reserved-blue { background: var(--blue-tint); }
        .reserved-red { background: var(--red-tint); }
        .p-red { color: var(--red); }
        .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); z-index: 1; }
        .selected-piece { background: var(--line); }
        .error-msg { color: var(--error); }
        .success-msg { color: var(--waiting); }
        .system-msg { color: var(--muted); }
        .highlight { color: var(--bright); }
        a { color: var(--blue); text-decoration: none; }

      function startRequestMonitoring(requestId) {
          activeRequestRef = dbMatch.ref(`RQ_D/${requestId}`);

              if (val && val.matchName) {

                  toggleWaiting(false);
                  activeRequestRef.off(); activeRequestRef = null;
                  lockOntoMatch(val.matchName, { status: 'SYNCING' });

              }
              if (!val) {

                  activeRequestRef.off(); activeRequestRef = null;
                  setStatus("MATCH_FORMED_LOOKING");

                  for (let i = 0; i < 6; i++) {

      }

      function scrollToBottom() { window.scrollTo(0, document.body.scrollHeight); }
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      function setStatus(msg) { if (requestStatus === msg) return; requestStatus = msg; add(`[STATUS] ${msg}`, 'system-msg'); }
      function createLine(cls='') { const d = document.createElement('div'); d.className = `history-line ${cls}`; if (currentPromptWrap) logContainer.insertBefore(d, currentPromptWrap); else logContainer.appendChild(d); scrollToBottom(); return d; }
      function add(text, cls='', req=false, handler=null) { if (!req && processing) { type(text, cls, true); return; } queue.push({text,cls,req,handler}); if (!processing) run(); }
      function addHTML(html, cls='') { const l = createLine(cls); l.innerHTML = html; }
      async function run() { processing = true; while(queue.length) { const i = queue.shift(); if (i.req) await prompt(i.text, i.cls, i.handler || handleAuth); else await type(i.text, i.cls); } processing = false; }
      async function type(text, cls, immediate=false) { const l = createLine(cls); if (immediate) { l.textContent = text; return l; } for (const c of text) { l.textContent += c; await sleep(10); } return l; }
      
      async function prompt(text, cls, handler) {
        const wrap = document.createElement('div'); wrap.className = 'input-wrapper history-line';
        const p = document.createElement('span'); p.className = 'prompt'; wrap.appendChild(p);
        const input = document.createElement('textarea'); input.className = 'user-input-line'; input.rows = 1; input.spellcheck = false; wrap.appendChild(input);
        logContainer.appendChild(wrap); currentPromptWrap = wrap;
        for (const c of text) { p.textContent += c; await sleep(8); }
        input.focus();
        return new Promise(resolve => {
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = input.value.trim(); input.disabled = true; const finalLine = createLine('highlight'); finalLine.textContent = p.textContent + " " + v; wrap.remove(); currentPromptWrap = null; handler(v); resolve(); }
          });
        });
      }

      function getPieceChar(piece) { const rot = piece.rotation || 0; return ROTATION_TABLE[piece.pieceType] ? ROTATION_TABLE[piece.pieceType][rot] : '?'; }
      function getBoardPieces(state) { const src = state.board || state; return Array.isArray(src.pieces) ? src.pieces : (src.pieces ? Object.values(src.pieces) : []); }
      function getReservedClass(x, y) { if (BLUE_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-blue'; if (RED_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-red'; return null; }
      function inBounds(x, y) { return x >= 0 && x <= 9 && y >= 0 && y <= 7; }
      function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
      function isReservedSquare(x, y, color) { return color === 'BLUE' ? RED_RESERVED.some(s => s.x === x && s.y === y) : BLUE_RESERVED.some(s => s.x === x && s.y === y); }
      function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
      
      function interactWithLaser(piece, incomingDir) {
          const typeMap = INTERACTION_MAP[piece.pieceType];
          if (!typeMap) return { kind: 'stop', destroyed: false };
          const outcome = typeMap[normalizeRotation(piece.rotation)]?.[incomingDir];
          if (!outcome) return { kind: 'stop', destroyed: false };
          if (outcome.action === 'reflect') return { kind: 'reflect', destroyed: false, reflected: outcome.nextDir };
          if (outcome.action === 'block') return { kind: 'stop', blocked: true, destroyed: false };
          if (outcome.action === 'destroy') return { kind: 'stop', destroyed: true };
          return { kind: 'stop', destroyed: false };
      }

      function resolveLaserVector(x, y, dir, pieces, path = [], seen = new Set()) {
          if (!inBounds(x, y)) return { path, hit: null, looped: false };
          const stateKey = `${x},${y},${dir}`;
          if (seen.has(stateKey)) return { path, hit: null, looped: true };
          seen.add(stateKey);
          path.push({ x, y, dir });
          const piece = getPieceAt(pieces, x, y);
          if (!piece) return resolveLaserVector(x + DIRS[dir].dx, y + DIRS[dir].dy, dir, pieces, path, seen);
          const outcome = interactWithLaser(piece, dir);
          if (outcome.kind === 'reflect') {
              const nextDir = outcome.reflected;
              return resolveLaserVector(x + DIRS[nextDir].dx, y + DIRS[nextDir].dy, nextDir, pieces, path, seen);
          }
          return { path, hit: { piece, blocked: !!outcome.blocked, destroyed: !!outcome.destroyed }, looped: false };
      }

      async function playLaserAnimation(state, pieces, shooterColor, victimPiece = null) {
          isAnimatingLocalTurn = true;
          const animPieces = [...pieces];
          if (victimPiece && !animPieces.some(p => p.x === victimPiece.x && p.y === victimPiece.y)) animPieces.push(victimPiece);
          const animState = { ...state, board: { ...state.board, pieces: animPieces } };
          const shooter = animPieces.find(p => p && p.pieceType === 'LASER' && p.color === shooterColor);
          if (shooter) {
              const startDir = normalizeRotation(shooter.rotation);
              const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, animPieces);
              printTerminalMatrix(animState, [], false);
              await sleep(500);
              printTerminalMatrix(animState, trace.path, false);
              await sleep(1500);
          }
          isAnimatingLocalTurn = false;
      }

      async function loadQTables() {
          if (qTables.BLUE && qTables.RED) return true;
          try {
              add("Loading neural pathways from Q-tables...", "system-msg");
              const [resBlue, resRed] = await Promise.all([fetch('blue_qtable (1).json'), fetch('red_qtable (1).json')]);
              const dataBlue = await resBlue.json();
              const dataRed = await resRed.json();
              qTables.BLUE = dataBlue.qTable || dataBlue;
              qTables.RED = dataRed.qTable || dataRed;
              add("AI parameters loaded successfully.", "success-msg");
              return true;
          } catch (e) {
              add(`Engine Error: Failed to load Q-tables. (${e.message})`, "error-msg");
              return false;
          }
      }

      function getBoardStateKey(state, side) {
          const targetBoard = state.board || state;
          const pieces = [...getBoardPieces(targetBoard)].map(p => `${p.color[0]}${p.pieceType[0]}${normalizeRotation(p.rotation)}@${p.x},${p.y}`).sort().join('|');
          return `${side}|${targetBoard.turn}|${targetBoard.phase || 'MOVE'}|${pieces}`;
      }

      function generateAIActions(state, side) {
          const pieces = getBoardPieces(state).filter(p => p.color === side);
          const allPieces = getBoardPieces(state);
          const actions = [];
          for (const p of pieces) {
              if (p.pieceType !== 'LASER') {
                  for (let dx = -1; dx <= 1; dx++) {
                      for (let dy = -1; dy <= 1; dy++) {
                          if (dx === 0 && dy === 0) continue;
                          const nx = p.x + dx, ny = p.y + dy;
                          if (!inBounds(nx, ny) || isReservedSquare(nx, ny, side)) continue;
                          const target = getPieceAt(allPieces, nx, ny);
                          if (!target) actions.push({ kind: 'move', pieceId: p.id, from: { x: p.x, y: p.y }, to: { x: nx, y: ny }, pieceType: p.pieceType });
                          else if (p.pieceType === 'SWITCH' && (target.pieceType === 'DEFLECTOR' || target.pieceType === 'DEFENDER') && !isReservedSquare(p.x, p.y, target.color)) actions.push({ kind: 'swap', pieceId: p.id, from: { x: p.x, y: p.y }, to: { x: nx, y: ny }, pieceType: p.pieceType });
                      }
                  }
              }
              if (p.pieceType !== 'KING') {
                  const r1 = normalizeRotation((p.rotation || 0) + 1);
                  const r2 = normalizeRotation((p.rotation || 0) - 1);
                  const canRotateR1 = p.pieceType !== 'LASER' || (p.color === 'BLUE' && (r1 === 0 || r1 === 3)) || (p.color === 'RED' && (r1 === 1 || r1 === 2));
                  const canRotateR2 = p.pieceType !== 'LASER' || (p.color === 'BLUE' && (r2 === 0 || r2 === 3)) || (p.color === 'RED' && (r2 === 1 || r2 === 2));
                  if (canRotateR1) actions.push({ kind: 'rotate', pieceId: p.id, delta: 1, rot: r1, from: { x: p.x, y: p.y }, pieceType: p.pieceType });
                  if (canRotateR2) actions.push({ kind: 'rotate', pieceId: p.id, delta: -1, rot: r2, from: { x: p.x, y: p.y }, pieceType: p.pieceType });
              }
          }
          actions.push({ kind: 'fire' });
          return actions;
      }

      function serializeAIAction(a) { if (a.kind === 'move' || a.kind === 'swap') return `${a.kind}:${a.pieceId}:${a.to.x},${a.to.y}`; if (a.kind === 'rotate') return `${a.kind}:${a.pieceId}:${a.delta}`; return a.kind; }
      function selectAIAction(state, side) {
          const actions = generateAIActions(state, side);
          const sKey = getBoardStateKey(state, side);
          if (!actions.length) return null;
          let bestV = -Infinity;
          let bestActions = [];
          const table = qTables[side] || {};
          const stateVals = table[sKey] || {};
          for (const a of actions) {
              const v = stateVals[serializeAIAction(a)] || 0;
              if (v > bestV + 1e-12) { bestV = v; bestActions = [a]; } 
              else if (Math.abs(v - bestV) <= 1e-12) { bestActions.push(a); }
          }
          return bestActions[Math.floor(Math.random() * bestActions.length)];
      }

      async function checkAITurn() {
          if (!isAIMode || !latestState || isAIThinking) return;
          const currentTurn = latestState.board?.turn || latestState.turn || 'RED';
          if (currentTurn === aiColor && !(latestState.status && latestState.status.endsWith('_WIN'))) {
              isAIThinking = true;
              add(`[AI] Agent is computing move for ${aiColor}...`, 'system-msg');
              await sleep(600);
              const action = selectAIAction(latestState, aiColor);
              if (!action) {
                  add(`[AI] Agent yielded.`, 'error-msg');
                  isAIThinking = false;
                  await processGameAction({ action: 'Turn End' });
                  return;
              }
              let intent;
              if (action.kind === 'move' || action.kind === 'swap') intent = { action: 'Move', piece: { x: action.from.x, y: action.from.y, type: action.pieceType }, changes: { new: { x: action.to.x, y: action.to.y } } };
              else if (action.kind === 'rotate') intent = { action: 'Rotate', piece: { x: action.from.x, y: action.from.y, type: action.pieceType }, changes: { new: { rotation: action.rot } } };
              else intent = { action: 'Manual Fire' }; 
              try { await processGameAction(intent); } finally { isAIThinking = false; }
          }
      }

          isLMode = true; isAIMode = true; modeShown = false; lockedMatchId = 'AI_GAME';
          humanColor = chosenColor === 'RED' ? 'RED' : 'BLUE';
          aiColor = humanColor === 'RED' ? 'BLUE' : 'RED';
          latestState = { board: { turn: "BLUE", phase: "MOVE", moveNumber: 1, pieces: [
              {id: "pmpfnkxpm1", pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0}, {id: "pmpfnl4j03", pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7},
              {id: "pmpfqugdq4", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 4, y: 7}, {id: "pmpfquhvx5", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 6, y: 7},
              {id: "pmpfqunnp6", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 5, y: 0}, {id: "pmpfquoqi7", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 3, y: 0},
              {id: "pmpfqvc388", pieceType: "SWITCH", color: "BLUE", rotation: 0, x: 5, y: 3}, {id: "pmpfqvfrb9", pieceType: "SWITCH", color: "BLUE", rotation: 1, x: 4, y: 3},
              {id: "pmpfqvl06a", pieceType: "SWITCH", color: "RED", rotation: 0, x: 4, y: 4}, {id: "pmpfqvre4b", pieceType: "SWITCH", color: "RED", rotation: 1, x: 5, y: 4},
              {id: "pmpfqwdqec", pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7}, {id: "pmpfqy5dve", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 0},
              {id: "pmpfqya0pf", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 3}, {id: "pmpfqyd1rg", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 2, y: 4},
              {id: "pmpfqz0jlj", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 0, y: 3}, {id: "pmpfqz7fpk", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 0, y: 4},
              {id: "pmpfqzj2ul", pieceType: "DEFLECTOR", color: "BLUE", rotation: 3, x: 7, y: 1}, {id: "pmpfr0e5km", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 6, y: 2},
              {id: "pmpfr0t7zn", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 4}, {id: "pmpfr0ww1o", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 7, y: 3},
              {id: "pmpfr18esp", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 9, y: 3}, {id: "pmpfr1bjtq", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 9, y: 4},
              {id: "pmpfr2ek5s", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 3, y: 5}, {id: "pmpfr2sl8u", pieceType: "DEFLECTOR", color: "RED", rotation: 1, x: 2, y: 6},
              {id: "pmpfr337lv", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 7}, {id: "pmpfr69imw", pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0}
          ]}};
          printTerminalMatrix(latestState);
          add(`AI Environment Set.`, "success-msg");
          if (latestState.board.turn === aiColor) checkAITurn();
      }
      
      function isHumanTurn() { if (!latestState) return false; const currentTurn = latestState.board?.turn || latestState.turn || 'RED'; return isAIMode ? currentTurn === humanColor : true; }

      function startLocalGame() {
          isLMode = true; modeShown = false; lockedMatchId = 'LOCAL_GAME';
          const saved = localStorage.getItem(KEY_LOCAL_STATE);
          if (saved) { try { latestState = JSON.parse(saved); add("Resuming.", "success-msg"); } catch (e) { localStorage.removeItem(KEY_LOCAL_STATE); } }
          if (!latestState) { latestState = { board: { turn: "BLUE", phase: "MOVE", moveNumber: 1, pieces: [ {id: "pmpfnkxpm1", pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0}, {id: "pmpfnl4j03", pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7}, {id: "pmpfqugdq4", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 4, y: 7}, {id: "pmpfquhvx5", pieceType: "DEFENDER", color: "RED", rotation: 2, x: 6, y: 7}, {id: "pmpfqunnp6", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 5, y: 0}, {id: "pmpfquoqi7", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 3, y: 0}, {id: "pmpfqvc388", pieceType: "SWITCH", color: "BLUE", rotation: 0, x: 5, y: 3}, {id: "pmpfqvfrb9", pieceType: "SWITCH", color: "BLUE", rotation: 1, x: 4, y: 3}, {id: "pmpfqvl06a", pieceType: "SWITCH", color: "RED", rotation: 0, x: 4, y: 4}, {id: "pmpfqvre4b", pieceType: "SWITCH", color: "RED", rotation: 1, x: 5, y: 4}, {id: "pmpfqwdqec", pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7}, {id: "pmpfqy5dve", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 0}, {id: "pmpfqya0pf", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 3}, {id: "pmpfqyd1rg", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 2, y: 4}, {id: "pmpfqz0jlj", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 0, y: 3}, {id: "pmpfqz7fpk", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 0, y: 4}, {id: "pmpfqzj2ul", pieceType: "DEFLECTOR", color: "BLUE", rotation: 3, x: 7, y: 1}, {id: "pmpfr0e5km", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 6, y: 2}, {id: "pmpfr0t7zn", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 4}, {id: "pmpfr0ww1o", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 7, y: 3}, {id: "pmpfr18esp", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 9, y: 3}, {id: "pmpfr1bjtq", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 9, y: 4}, {id: "pmpfr2ek5s", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 3, y: 5}, {id: "pmpfr2sl8u", pieceType: "DEFLECTOR", color: "RED", rotation: 1, x: 2, y: 6}, {id: "pmpfr337lv", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 7}, {id: "pmpfr69imw", pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0} ] } }; }
          printTerminalMatrix(latestState);
          add("Local Mode Initialized.", "success-msg");
      }

      function printTerminalMatrix(state, laserPath = [], replace = true) {
        latestState = state;
        const pieces = getBoardPieces(state);
        const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
        for (const piece of pieces) { if (piece && Number.isFinite(piece.x)) grid[piece.y][piece.x] = piece; }
        const container = document.createElement('div'); container.className = 'matrix-container';
        const currentTurn = state.board?.turn || state.turn || 'RED';
        const statusBar = document.createElement('div'); statusBar.className = 'history-line'; statusBar.style.marginBottom = '12px'; statusBar.style.fontSize = '20px'; statusBar.style.borderBottom = '1px dashed var(--line)'; statusBar.style.paddingBottom = '6px'; statusBar.innerHTML = `[<span class="highlight">TURN</span>: <span class="p-${currentTurn.toLowerCase()}">${currentTurn}</span>]`; container.appendChild(statusBar);
        const instrHeader = document.createElement('div'); instrHeader.innerHTML = `<div style="font-size: 15px; border: 1px solid var(--line); padding: 10px; margin-bottom: 12px; background: var(--bg0); color: var(--text); font-family: monospace; line-height: 1.4;"><b style="color: var(--bright);">🏆 OBJECTIVE:</b> Eliminate the enemy <b>KING</b>...</div>`; container.appendChild(instrHeader);
        for (let y = 7; y >= 0; y--) {
          let rowEl = document.createElement('div'); rowEl.className = 'matrix-row';
          for (let x = 0; x < 10; x++) {
            let cellEl = document.createElement('span'); cellEl.className = 'matrix-cell';
            const resClass = getReservedClass(x, y); if (resClass) cellEl.classList.add(resClass); if (x === cursorX && y === cursorY) cellEl.classList.add('cursor'); if (selectedOrigin && x === selectedOrigin.x && y === selectedOrigin.y) cellEl.classList.add('selected-piece');
            cellEl.addEventListener('click', (e) => { e.preventDefault(); if (isAnimatingLocalTurn) return; cursorX = x; cursorY = y; printTerminalMatrix(latestState); handleGridAction(); });
            const p = grid[y][x]; if (p) { cellEl.textContent = getPieceChar(p); cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); } else { const pathSegment = laserPath.find(seg => seg.x === x && y === seg.y); if (pathSegment) { cellEl.textContent = ['^', '>', 'v', '<'][pathSegment.dir]; cellEl.style.color = 'var(--laser)'; } else cellEl.textContent = '·'; }
            rowEl.appendChild(cellEl);
          }
          container.appendChild(rowEl);
        }
        if (state.status && state.status.endsWith('_WIN')) { const winner = state.status.split('_')[0]; const div = document.createElement('div'); div.className = 'success-msg'; div.style.marginTop = '10px'; div.textContent = `GAME OVER: ${winner} WINS!`; container.appendChild(div); }
        if (replace && activeMatrixContainer && activeMatrixContainer.parentNode) activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer); else if (currentPromptWrap) logContainer.insertBefore(container, currentPromptWrap); else logContainer.appendChild(container); 
        if (replace) activeMatrixContainer = container; scrollToBottom();
      }

      window.addEventListener('keydown', (e) => {
        if (currentPromptWrap || isAnimatingLocalTurn || isHostRequestPending || !isHumanTurn()) return;
        if (e.key.toLowerCase() === 'q') { processGameAction({ action: 'Resign' }); return; }
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key) || ['r', 'l', 'f', 'q'].includes(e.key.toLowerCase())) e.preventDefault(); else return;
        if (e.key === 'ArrowUp' && cursorY < 7) cursorY++; else if (e.key === 'ArrowDown' && cursorY > 0) cursorY--; else if (e.key === 'ArrowLeft' && cursorX > 0) cursorX--; else if (e.key === 'ArrowRight' && cursorX < 9) cursorX++; else if (e.key === 'Enter') handleGridAction(); else if (e.key.toLowerCase() === 'r') rotatePiece(1); else if (e.key.toLowerCase() === 'l') rotatePiece(-1); else if (e.key.toLowerCase() === 'f') skipTurnAndFire();
        if (latestState) printTerminalMatrix(latestState);
      });

      async function processGameAction(intent) {
        if (!latestState) return;
        const currentTurn = latestState.board?.turn || latestState.turn || 'RED';
        let activePlayer = isAIMode ? (isAIThinking ? aiColor : humanColor) : (isLMode ? currentTurn : (localStorage.getItem('ls_my_color') || 'RED'));
        if (intent.action === 'Resign') {
            const winner = currentTurn === 'RED' ? 'BLUE' : 'RED';
            latestState.status = `${winner}_WIN`;
            add(`${currentTurn} RESIGNED. ${winner} WINS.`, "success-msg");
            localStorage.removeItem(KEY_LOCAL_STATE);
            if (!isLMode && !isAIMode) {
                fetch(MOVE_CHECKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ matchId: lockedMatchId, username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), intent: intent }) }).catch(e => add(`Resign Error: ${e.message}`, 'error-msg'));
            }
            printTerminalMatrix(latestState);
            if (isLMode || isAIMode) { setTimeout(() => { lockedMatchId = null; isLMode = false; isAIMode = false; modeShown = false; showMode(); }, 5000); }
            return;
        }
        if (!isLMode && (!localStorage.getItem(KEY_RID) || !localStorage.getItem(KEY_USER) || !localStorage.getItem(KEY_PASS))) { add("Error: Missing credentials.", "error-msg"); return; }
        try {
            if ((isAIMode || !isLMode) && currentTurn !== activePlayer) throw new Error(`Turn violation: It is ${currentTurn}'s turn.`);
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const piecesDryRun = getBoardPieces(latestState);
                const dbPiece = getPieceAt(piecesDryRun, intent.piece.x, intent.piece.y);
                if (!dbPiece) throw new Error("No piece at origin.");
                if ((isAIMode || !isLMode) && dbPiece.color !== activePlayer) throw new Error(`Color violation.`);
                if (intent.action === 'Move') {
                    const nx = intent.changes.new.x; const ny = intent.changes.new.y; const pieceAtTarget = getPieceAt(piecesDryRun, nx, ny);
                    if (dbPiece.pieceType === 'LASER') throw new Error("LASER immobilized.");
                    if (isReservedSquare(nx, ny, dbPiece.color)) throw new Error("Reserved zone conflict.");
                    if (pieceAtTarget && !(dbPiece.pieceType === 'SWITCH' && (pieceAtTarget.pieceType === 'DEFLECTOR' || pieceAtTarget.pieceType === 'DEFENDER'))) throw new Error("Collision.");
                }
            }
        } catch (localErr) { add(`Validation Error: ${localErr.message}`, 'error-msg'); selectedOrigin = null; printTerminalMatrix(latestState); return; }
        const initialStateBackup = JSON.parse(JSON.stringify(latestState));
        isAnimatingLocalTurn = true; 
        try {
            const stateCopy = JSON.parse(JSON.stringify(latestState)); let pieces = getBoardPieces(stateCopy);
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
                if (intent.action === 'Move') { const nx = intent.changes.new.x; const ny = intent.changes.new.y; const pieceAtTarget = getPieceAt(pieces, nx, ny); if (pieceAtTarget && dbPiece.pieceType === 'SWITCH') { pieceAtTarget.x = dbPiece.x; pieceAtTarget.y = dbPiece.y; } dbPiece.x = nx; dbPiece.y = ny; } 
                else if (intent.action === 'Rotate') dbPiece.rotation = intent.changes.new.rotation;
                if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
            }
            const shooter = pieces.find(p => p && p.pieceType === 'LASER' && p.color === activePlayer);
            if (shooter) {
                const trace = resolveLaserVector(shooter.x + DIRS[normalizeRotation(shooter.rotation)].dx, shooter.y + DIRS[normalizeRotation(shooter.rotation)].dy, normalizeRotation(shooter.rotation), pieces);
                const victim = (trace.hit && trace.hit.destroyed) ? trace.hit.piece : null;
                await playLaserAnimation(stateCopy, pieces, activePlayer, victim);
                if (victim) {
                    pieces = pieces.filter(p => !(p.x === victim.x && p.y === victim.y));
                    if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                    if (victim.pieceType === 'KING') { stateCopy.status = `${victim.color === 'RED' ? 'BLUE' : 'RED'}_WIN`; }
                    activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
                }
            }
            const nextTurn = currentTurn === 'RED' ? 'BLUE' : 'RED';
            if (stateCopy.board) { stateCopy.board.turn = nextTurn; stateCopy.board.moveNumber = (stateCopy.board.moveNumber || 0) + 1; } else { stateCopy.turn = nextTurn; stateCopy.moveNumber = (stateCopy.moveNumber || 0) + 1; }
            latestState = stateCopy;
            localStorage.setItem(KEY_LOCAL_STATE, JSON.stringify(latestState));
            if (!isLMode) {
                const resp = await fetch(MOVE_CHECKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ matchId: lockedMatchId, username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), intent: intent }) });
                const result = await resp.json();
                if (!resp.ok || !result.ok) throw new Error(result.error || "Validation failure.");
            }
        } catch (err) { add(`Mutation Error: ${err.message}`, 'error-msg'); latestState = initialStateBackup; } finally { 
            activeMatrixContainer = null; isAnimatingLocalTurn = false; printTerminalMatrix(latestState); 
            if (pendingStateUpdate) { const s = pendingStateUpdate; pendingStateUpdate = null; applyRemoteState(s); }
            if (isAIMode) setTimeout(checkAITurn, 100);
        }
        selectedOrigin = null;
      }

      async function skipTurnAndFire() { await processGameAction({ action: 'Turn End' }); }
      function rotatePiece(dir) {
        if (!selectedOrigin || !latestState || !isHumanTurn()) return;
        const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
        if (p) processGameAction({ action: 'Rotate', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: p.pieceType }, changes: { new: { rotation: ((p.rotation || 0) + dir + 4) % 4 } } });
      }

      async function handleGridAction() {
        if (!latestState || isAnimatingLocalTurn || !isHumanTurn()) return;
        if (!selectedOrigin) {
            const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === cursorX && p.y === cursorY);
            if (p) { selectedOrigin = { x: cursorX, y: cursorY }; printTerminalMatrix(latestState); }
        } else {
            const pieces = getBoardPieces(latestState); const movingPiece = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
            if (selectedOrigin.x === cursorX && selectedOrigin.y === cursorY) { selectedOrigin = null; printTerminalMatrix(latestState); }
            else await processGameAction({ action: 'Move', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: movingPiece?.pieceType }, changes: { new: { x: cursorX, y: cursorY } } });
        }
      }

      function terminateMatch(msg) { 
        add(msg, 'error-msg'); localStorage.removeItem(KEY_RID); localStorage.removeItem('ls_my_color'); lockedMatchId = null; modeShown = false; isLMode = false; isAIMode = false;
        if (activeGameRef) { activeGameRef.off(); activeGameRef = null; }
        if (activeRequestRef) { activeRequestRef.off(); activeRequestRef = null; }
        setStatus("IDLE"); startPolling(); 
      }

      async function applyRemoteState(state) {
        const status = state.status || '';
        const ld = state.metadata?.lastdestroyed;
        isAnimatingLocalTurn = true;
        try {
          if (ld && ld.turn !== lastAnimatedTurn) { lastAnimatedTurn = ld.turn; await playLaserAnimation(state, getBoardPieces(state), ld.shooterColor, ld.piece); }
          printTerminalMatrix(state); 
          if (status.endsWith('_WIN')) { add("Game Over.", "success-msg"); await sleep(5000); terminateMatch('Reset.'); }
        } finally { isAnimatingLocalTurn = false; if (pendingStateUpdate) { const s = pendingStateUpdate; pendingStateUpdate = null; applyRemoteState(s); } }
      }

      function lockOntoMatch(id, entry) {
        lockedMatchId = id; localStorage.setItem(KEY_RID, id); stopPolling(); toggleWaiting(false); modeShown = false;
        setStatus("LOCKED");
        activeGameRef = dbGame.ref(`G/${id}`);
        activeGameRef.on('value', async snap => { 
          const state = snap.val(); 
          if (!state) { terminateMatch('MATCH TERMINATED.'); return; } 
          if (isAnimatingLocalTurn) { pendingStateUpdate = state; return; }
          await applyRemoteState(state);
        });
      }

      function toggleWaiting(active, contextMsg = "Awaiting Handshake") {
        if (active) { if (waitAnimationInterval) return; const l = createLine('wait-msg'); let dots = 0; waitAnimationInterval = setInterval(() => { dots = (dots + 1) % 4; l.textContent = contextMsg + ".".repeat(dots); }, 500); } 
        else if (waitAnimationInterval) { clearInterval(waitAnimationInterval); waitAnimationInterval = null; }
      }

      async function handleAuth(v) {
        const val = v.trim();
        if (!localStorage.getItem(KEY_USER)) { localStorage.setItem(KEY_USER, val.toUpperCase()); return boot(); }
        if (!localStorage.getItem(KEY_PASS)) { localStorage.setItem(KEY_PASS, val); return boot(); }
      }

      function applyFontPreference(pref) { if (pref === 'BASIC') document.body.classList.add('basic-font'); else document.body.classList.remove('basic-font'); }

      async function handleFontChoice(v) {
        const val = v.trim().toUpperCase();
        if (val === 'T') localStorage.setItem(KEY_FONT, 'THEMATIC'); else if (val === 'B') localStorage.setItem(KEY_FONT, 'BASIC'); else return add('Selection (T/B):', '', true, handleFontChoice);
        boot();
      }

      async function boot() {
        const u = localStorage.getItem(KEY_USER), p = localStorage.getItem(KEY_PASS), rid = localStorage.getItem(KEY_RID);
        add('LASER CHESS', 'system-msg');
        if (!u) return add('Session Username:', '', true, handleAuth);
        if (!p) return add('Session Password:', '', true, handleAuth);
        const fontPref = localStorage.getItem(KEY_FONT);
        if (!fontPref) { add("[T] Thematic\n[B] Basic", 'system-msg'); return add('Selection (T/B):', '', true, handleFontChoice); }
        applyFontPreference(fontPref);
        if (rid) { 
            const snapGame = await dbGame.ref(`G/${rid}`).once('value'); 
            const snapReq = await dbMatch.ref(`RQ_D/${rid}`).once('value');
            if (snapGame.exists()) return lockOntoMatch(rid, snapGame.val()); 
            else if (!snapReq.exists()) { localStorage.removeItem(KEY_RID); }
            else { isHostRequestPending = true; setStatus("WAITING_FOR_MATCH"); startRequestMonitoring(rid); }
        }
        if (!lockedMatchId) await startPolling();
      }

      function startQueueListener() {
          if (queueRef) return;
          queueRef = dbMatch.ref('/RQ_Q').orderByKey().limitToFirst(1);
          queueRef.on('value', (snap) => {
              const data = snap.val();
              if (!data) currentHead = null;
              else {
                  const firstKey = Object.keys(data)[0];
                  currentHead = { id: firstKey, data: data[firstKey] };
              }
          });
      }

      async function startPolling() {
        if (isPollingStarting) return; 
        isPollingStarting = true;
        startQueueListener();
        modeShown = false; 
        await showMode();
        isPollingStarting = false;
      }

      function stopPolling() { 
          if (queueRef) { queueRef.off(); queueRef = null; }
      }

      async function showMode() {
        if (lockedMatchId || isHostRequestPending) return; 
        while (processing) await sleep(10); 
        if (modeShown) return; 
        modeShown = true;
        let menu = "--- MENU ---\n";
        if (!currentHead) menu += "Queue Empty.\n";
        else if (currentHead.data.color === 0) menu += "RED at head. [A] Join as Blue\n"; 
        else menu += "BLUE at head. [A] Join as Red\n";
        menu += "[R] Host Red | [B] Host Blue | [P] Private | [J] Join Private | [L] Local | [C] AI";
        add(menu, 'system-msg');
        add('MODE:', '', true, handleMode);
      }

      async function handleMode(val) {
        if (val === 'L') startLocalGame();
        else if (val === 'A') { if (!currentHead) { add('EMPTY', 'error-msg'); modeShown = false; return showMode(); } registerHost(currentHead.data.color === 0 ? 1 : 0, true); } 
        else if (val === 'R') registerHost(0, false); 
        else if (val === 'B') registerHost(1, false);
        else if (val === 'P') { add('Target User:', '', true, (target) => add('Color [R/B]:', '', true, (c) => requestPrivateMatch(c === 'R' ? 0 : 1, target))); }
        else if (val === 'J') { add('Invite Code:', '', true, (code) => joinPrivateMatch(code)); }
        else if (val === 'C') { add('Color [R/B]:', '', true, (c) => startAIGame(c === 'R' ? 'RED' : 'BLUE')); }
        else { add('Unknown.', 'error-msg'); modeShown = false; showMode(); }
      }

      async function requestPrivateMatch(color, target) {
          setStatus("NEGOTIATING");
          toggleWaiting(true, "Lobbying");
          try {
              const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: "PRIVATE_MATCH_REQUEST", body: { requester: localStorage.getItem(KEY_USER), secret: localStorage.getItem(KEY_PASS), color, target } }) });
              const data = await res.json();
              if (data.ok) { localStorage.setItem(KEY_RID, data.requestId); isHostRequestPending = true; startRequestMonitoring(data.requestId); } else { add(data.error, 'error-msg'); toggleWaiting(false); modeShown = false; startPolling(); }
          } catch (e) { toggleWaiting(false); modeShown = false; startPolling(); }
      }

      async function joinPrivateMatch(inviteCode) {
          setStatus("JOINING");
          try {
              const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), isPrivate: true, privateMode: "JOIN", inviteCode }) });
              const data = await res.json();
              if (data.ok) lockOntoMatch(data.matchName, { status: 'SYNCING' }); else add(data.error, 'error-msg');
          } catch (e) { add('Error', 'error-msg'); }
      }

      async function registerHost(color, isIntercept = false) {
        if (isHostRequestPending) return;
        isHostRequestPending = true;
        localStorage.setItem('ls_my_color', color === 0 ? 'RED' : 'BLUE');
        try {
          const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: localStorage.getItem(KEY_USER), password: localStorage.getItem(KEY_PASS), color, isIntercept }) }); const data = await res.json();
          if (data.ok) {
            const idToStore = data.matchName || data.requestId || data.timestamp; 
            if (idToStore) localStorage.setItem(KEY_RID, idToStore); 
            stopPolling(); 
            if (data.matchName) lockOntoMatch(data.matchName, { status: 'SYNCING' }); 
            else startRequestMonitoring(idToStore);
          } else { isHostRequestPending = false; modeShown = false; startPolling(); }
        } catch (e) { isHostRequestPending = false; modeShown = false; startPolling(); }
      }

      window.addEventListener('DOMContentLoaded', boot);
    })();
    </script>
